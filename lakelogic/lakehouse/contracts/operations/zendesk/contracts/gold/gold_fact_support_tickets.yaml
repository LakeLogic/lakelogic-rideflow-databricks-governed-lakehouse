version: 1.0.0

info:
  title: Gold — Fact Support Tickets
  target_layer: gold
  description: 'grain: one row per support ticket'
  table_name: '{gold_layer}_fact_support_tickets'
  system: zendesk
  domain: operations

model:
  fields:
  - name: ticket_id
    type: string
    required: true
    description: Unique identifier for the support ticket, essential for tracking
      and referencing specific issues.
  - name: satisfaction_rating
    type: float
    required: false
    description: Customer satisfaction score associated with the ticket, vital for
      assessing service quality and areas for improvement.
  - name: entry_point
    type: string
    required: false
    description: Indicates where the support ticket was submitted, helping to understand
      customer behavior and channel effectiveness.
  - name: trip_id
    type: string
    required: false
    description: Identifier for the trip related to the ticket, connecting support
      issues to specific transactions.
  - name: charge_id
    type: string
    required: false
    description: Identifier for the charge related to the ticket, important for financial
      tracking and chargebacks.
  - name: requester_name
    type: string
    required: false
    description: Name of the ticket requester, aiding in personalized customer service
      and record-keeping.
  - name: subject
    type: string
    required: false
    description: Brief summary of the ticket issue, facilitating quick understanding
      and categorization.
  - name: ticket_description
    type: string
    required: false
    description: Detailed description of the issue, necessary for comprehensive problem
      resolution and analysis.
  - name: status
    type: string
    required: false
    description: Current state of the ticket, indicating whether it is open, in progress,
      or resolved.
  - name: priority
    type: string
    required: false
    description: Level of urgency for the ticket, guiding the order in which issues
      are addressed.
  - name: channel
    type: string
    required: false
    description: The medium through which the ticket was submitted (e.g., email, chat,
      phone), useful for channel performance analysis.
  - name: assignee
    type: string
    required: false
    description: Identifier of the support agent assigned to the ticket, important
      for accountability and follow-up.
  - name: tags_json
    type: string
    required: false
    description: JSON-formatted tags categorizing the ticket, enabling efficient filtering
      and trend analysis.
  - name: created_at
    type: timestamp
    required: false
    description: Timestamp indicating when the ticket was created, crucial for tracking
      response times and SLAs.
  - name: updated_at
    type: timestamp
    required: false
    description: Timestamp indicating the last update to the ticket, helping monitor
      ongoing engagement and resolution progress.
  - name: solved_at
    type: timestamp
    required: false
    description: Timestamp indicating when the ticket was resolved, important for
      measuring resolution times and customer satisfaction.
  - name: created_date
    type: date
    required: false
    description: 'Partition column: the calendar date of `created_at`.'
  - name: system
    type: string
    required: true
    description: Source system this row came from

dataset: gold_fact_support_tickets

primary_key:
- ticket_id

quality:
  dataset_rules:
  - unique:
      columns:
      - ticket_id
      name: ticket_id_unique
      category: uniqueness
      description: No two rows share the same ticket_id.

transformations:
- phase: pre
  sql: |-
    SELECT
      r.ticket_id,
      r.entry_point,
      r.trip_id,
      r.charge_id,
      r.requester_name,
      r.subject,
      r.ticket_description,
      r.status,
      r.priority,
      r.channel,
      r.assignee,
      r.tags_json,
      r.created_at,
      r.updated_at,
      r.solved_at,
      r.satisfaction_rating AS satisfaction_rating,
      CAST(r.created_at AS DATE) AS created_date
    FROM source r
- phase: pre
  derive:
    field: system
    sql: '''zendesk'''

materialization:
  strategy: append
  fact:
    type: transaction
  partition_by:
  - created_date

source:
  type: table
  path: table:{domain_catalog}.{silver_layer}_zendesk_support_tickets
  load_mode: incremental
  watermark_field: _lakelogic_processed_at

metadata:
  run_log_table: '{domain_catalog}.lakelogic_run_log'
