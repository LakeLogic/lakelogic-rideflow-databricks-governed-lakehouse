version: 1.0.0

info:
  title: Silver — Zendesk Support Tickets
  target_layer: silver
  description: The table holds support ticket details from Zendesk, linking each ticket
    to specific riders, trips, drivers, and charges to track customer issues and service
    quality. It includes personal data such as requester email and phone number, along
    with timestamps for ticket creation, updates, and resolution, and captures customer
    satisfaction ratings to assess service effectiveness. The data originates from
    Zendesk support interactions, providing insights into customer service performance
    and issue resolution.
  table_name: '{silver_layer}_zendesk_support_tickets'
  system: zendesk
  domain: operations

model:
  fields:
  - name: ticket_id
    type: string
    required: true
    description: Unique identifier for the support ticket, essential for tracking
      and referencing specific issues.
  - name: entry_point
    type: string
    required: false
    description: Indicates where the support ticket was submitted, helping to understand
      customer behavior and channel effectiveness.
  - name: rider_id
    type: string
    required: true
    description: Identifier for the rider associated with the ticket, linking support
      issues to specific customers.
  - name: trip_id
    type: string
    required: true
    description: Identifier for the trip related to the ticket, connecting support
      issues to specific transactions.
  - name: driver_id
    type: string
    required: true
    description: Identifier for the driver involved in the ticket, relevant for assigning
      responsibility or follow-up actions.
  - name: charge_id
    type: string
    required: true
    description: Identifier for the charge related to the ticket, important for financial
      tracking and chargebacks.
  - name: requester_email
    type: string
    required: false
    pii: true
    classification: email
    description: Email address of the ticket requester, used for communication and
      personalization of support.
  - name: requester_name
    type: string
    required: false
    description: Name of the ticket requester, aiding in personalized customer service
      and record-keeping.
  - name: requester_phone
    type: string
    required: false
    pii: true
    classification: phone
    description: Phone number of the ticket requester, providing an additional contact
      method for support.
  - name: subject
    type: string
    required: false
    description: Brief summary of the ticket issue, facilitating quick understanding
      and categorization.
  - name: ticket_description
    type: string
    required: false
    description: Detailed description of the issue, necessary for comprehensive problem
      resolution and analysis.
  - name: status
    type: string
    required: false
    description: Current state of the ticket, indicating whether it is open, in progress,
      or resolved.
  - name: priority
    type: string
    required: false
    description: Level of urgency for the ticket, guiding the order in which issues
      are addressed.
  - name: channel
    type: string
    required: false
    description: The medium through which the ticket was submitted (e.g., email, chat,
      phone), useful for channel performance analysis.
  - name: assignee
    type: string
    required: false
    description: Identifier of the support agent assigned to the ticket, important
      for accountability and follow-up.
  - name: tags_json
    type: string
    required: false
    description: JSON-formatted tags categorizing the ticket, enabling efficient filtering
      and trend analysis.
  - name: created_at
    type: timestamp
    required: false
    description: Timestamp indicating when the ticket was created, crucial for tracking
      response times and SLAs.
  - name: updated_at
    type: timestamp
    required: false
    description: Timestamp indicating the last update to the ticket, helping monitor
      ongoing engagement and resolution progress.
  - name: solved_at
    type: timestamp
    required: false
    description: Timestamp indicating when the ticket was resolved, important for
      measuring resolution times and customer satisfaction.
  - name: satisfaction_rating
    type: float
    required: false
    description: Customer satisfaction score associated with the ticket, vital for
      assessing service quality and areas for improvement.
  - name: created_date
    type: date
    required: false
    description: 'Partition column: the calendar date of `created_at`.'

primary_key:
- ticket_id

quality:
  row_rules:
  - name: ticket_id_not_null
    sql: ticket_id IS NOT NULL
    category: completeness
    description: ticket_id is always present (never null).
  - name: rider_id_not_null
    sql: rider_id IS NOT NULL
    category: completeness
    description: rider_id is always present (never null).
  - name: trip_id_not_null
    sql: trip_id IS NOT NULL
    category: completeness
    description: trip_id is always present (never null).
  - name: driver_id_not_null
    sql: driver_id IS NOT NULL
    category: completeness
    description: driver_id is always present (never null).
  - name: charge_id_not_null
    sql: charge_id IS NOT NULL
    category: completeness
    description: charge_id is always present (never null).
  - name: ticket_id_not_null
    sql: ticket_id IS NOT NULL
    category: completeness
    description: ticket_id is always present (never null).

transformations:
- phase: pre
  derive:
    field: created_date
    sql: CAST(created_at AS DATE)
- deduplicate:
    by:
    - ticket_id
    sort_by:
    - updated_at
    order: desc

materialization:
  partition_by:
  - created_date

dataset: silver_zendesk_support_tickets

source:
  type: table
  path: table:{domain_catalog}.{bronze_layer}_zendesk_support_tickets
  load_mode: incremental
  watermark_field: _lakelogic_processed_at

metadata:
  run_log_table: '{domain_catalog}.lakelogic_run_log'
