version: 1.0.0

info:
  title: Bronze — Checkr Driver Verifications
  target_layer: bronze
  description: The table holds background check verification data for drivers, including
    personal identification details such as full name, date of birth, last four digits
    of Social Security Number, driver's license number, and residential address, along
    with the status, result, and timestamps for when the checks were created and completed.
    This data originates from Checkr's background check reports, linking each verification
    to a specific driver within the organization's system through a unique report
    and driver identifier.
  table_name: '{bronze_layer}_checkr_driver_verifications'
  domain: operations
  system: checkr

model:
  fields:
  - name: report_id
    type: string
    description: Unique identifier for the background check report generated by Checkr.
  - name: driver_id
    type: string
    description: Identifier linking the verification to a specific driver within the
      organization's system.
  - name: full_name
    type: string
    pii: true
    classification: person_name
    description: Full legal name of the driver as provided during the verification
      process.
  - name: date_of_birth
    type: string
    pii: true
    classification: date_of_birth
    description: Driver's date of birth used for identity verification and matching
      records.
  - name: ssn_last_four
    type: string
    pii: true
    classification: national_id
    description: Last four digits of the driver's Social Security Number used for
      identity confirmation.
  - name: licence_number
    type: string
    pii: true
    classification: licence_id
    description: Driver's vehicle license number verified as part of the background
      check.
  - name: address
    type: string
    pii: true
    classification: postal_address
    description: Current residential address of the driver used for verification purposes.
  - name: status
    type: string
    description: Current status of the background check (e.g., pending, completed,
      flagged).
  - name: result
    type: string
    description: Outcome of the verification process indicating pass, fail, or other
      relevant result.
  - name: completed_at
    type: timestamp
    description: Timestamp indicating when the background check was completed.
  - name: created_at
    type: timestamp
    description: Timestamp indicating when the background check request was created.
  - name: adjudication
    type: string
    description: Details of any manual review or decision made regarding the verification
      results.

source:
  type: landing
  path: '{landing_root}/driver_verifications'
  load_mode: full

primary_key:
- report_id

dataset: bronze_checkr_driver_verifications
