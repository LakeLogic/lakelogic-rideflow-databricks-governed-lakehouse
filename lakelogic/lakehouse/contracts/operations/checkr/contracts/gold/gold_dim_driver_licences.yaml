version: 1.0.0

info:
  title: Gold — Dim Driver Licences (SCD2)
  target_layer: gold
  description: 'grain: one row per driver licence'
  table_name: '{gold_layer}_dim_driver_licences'
  system: checkr
  domain: operations

model:
  fields:
  - name: driver_licences_sk
    type: string
    required: false
    description: 'Surrogate key: sha256 of the business key and the version start,
      written by the materializer; ''-1'' is the unknown member.'
  - name: licence_number
    type: string
    required: true
    pii: true
    masking: hash
    classification: licence_id
    description: The unique identifier for the driver's licence, used for verification
      and record-keeping.
  - name: effective_from
    type: timestamp
    required: false
    description: SCD2 effective from, written by the materializer.
  - name: effective_to
    type: timestamp
    required: false
    description: SCD2 effective to, written by the materializer.
  - name: is_current
    type: boolean
    required: false
    description: SCD2 current flag, written by the materializer.
  - name: version_number
    type: long
    required: false
    description: SCD2 version column, written by the materializer.
  - name: system
    type: string
    required: true
    description: Source system this row came from

dataset: gold_dim_driver_licences

primary_key:
- licence_number

materialization:
  strategy: scd2
  scd2:
    surrogate_key: driver_licences_sk
    surrogate_key_strategy: hash
    effective_from_field: effective_from
    effective_to_field: effective_to
    current_flag_field: is_current
    version_column: version_number
    track_columns:
    - expiry_date
    - vehicle_classes
    unknown_member:
      enabled: true
      surrogate_key_value: '-1'

quality:
  dataset_rules:
  - unique:
      columns:
      - licence_number
      - effective_from
      name: licence_number_effective_from_unique
      category: uniqueness
      description: No two rows share the same licence_number, effective_from.

source:
  type: table
  path: table:{domain_catalog}.{silver_layer}_checkr_driver_licences
  load_mode: incremental
  watermark_field: _lakelogic_processed_at

metadata:
  run_log_table: '{domain_catalog}.lakelogic_run_log'

transformations:
- phase: pre
  derive:
    field: system
    sql: '''checkr'''
