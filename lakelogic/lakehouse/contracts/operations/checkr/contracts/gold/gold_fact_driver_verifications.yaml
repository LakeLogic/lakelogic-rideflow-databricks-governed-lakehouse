version: 1.0.0

info:
  title: Gold — Fact Driver Verifications
  target_layer: gold
  description: 'grain: one row per driver verification'
  table_name: '{gold_layer}_fact_driver_verifications'
  system: checkr
  domain: operations

model:
  fields:
  - name: report_id
    type: string
    required: true
    description: Unique identifier for the background check report generated by Checkr.
  - name: driver_id
    type: string
    required: false
    description: Identifier linking the verification to a specific driver within the
      organization's system.
  - name: status
    type: string
    required: false
    description: Current status of the background check (e.g., pending, completed,
      flagged).
  - name: result
    type: string
    required: false
    description: Outcome of the verification process indicating pass, fail, or other
      relevant result.
  - name: completed_at
    type: timestamp
    required: false
    description: Timestamp indicating when the background check was completed.
  - name: created_at
    type: timestamp
    required: false
    description: Timestamp indicating when the background check request was created.
  - name: adjudication
    type: string
    required: false
    description: Details of any manual review or decision made regarding the verification
      results.
  - name: licence_sk
    type: string
    required: true
    foreign_key:
      contract: gold_dim_driver_licences
      column: driver_licences_sk
    description: Surrogate key of gold_dim_driver_licences, looked up as of completed_at;
      '-1' when the dimension does not know the row.
  - name: completed_date
    type: date
    required: false
    description: 'Partition column: the calendar date of `completed_at`.'
  - name: system
    type: string
    required: true
    description: Source system this row came from

dataset: gold_fact_driver_verifications

primary_key:
- report_id

quality:
  dataset_rules:
  - unique:
      columns:
      - report_id
      name: report_id_unique
      category: uniqueness
      description: No two rows share the same report_id.
  - name: licence_sk_unknown_member_rows
    sql: SELECT COUNT(*) FROM {dataset} WHERE licence_sk = '-1'
    must_be_less_than: 1
    severity: warning
    category: consistency
    description: Rows whose licence_sk fell back to the unknown member — the dimension
      did not know them when this fact ran.

transformations:
- phase: pre
  sql: |-
    SELECT
      r.report_id,
      r.driver_id,
      r.status,
      r.result,
      r.completed_at,
      r.created_at,
      r.adjudication,
      COALESCE(d1.driver_licences_sk, '-1') AS licence_sk,
      CAST(r.completed_at AS DATE) AS completed_date
    FROM source r
    LEFT JOIN gold_dim_driver_licences d1
      ON  r.licence_number = d1.licence_number
      AND r.completed_at >= d1.effective_from
      AND r.completed_at < COALESCE(d1.effective_to, CAST('9999-12-31 00:00:00' AS TIMESTAMP))
- phase: pre
  derive:
    field: system
    sql: '''checkr'''

links:
- name: gold_dim_driver_licences
  type: table
  path: table:{domain_catalog}.{gold_layer}_dim_driver_licences

upstream:
- gold_dim_driver_licences

materialization:
  strategy: append
  fact:
    type: factless
  partition_by:
  - completed_date

source:
  type: table
  path: table:{domain_catalog}.{silver_layer}_checkr_driver_verifications
  load_mode: incremental
  watermark_field: _lakelogic_processed_at

metadata:
  run_log_table: '{domain_catalog}.lakelogic_run_log'
