version: 1.0.0

info:
  title: Silver — Checkr Driver Verifications
  target_layer: silver
  description: The table contains detailed background check reports for drivers generated
    by Checkr, including personal identification information such as full name, date
    of birth, last four digits of the Social Security Number, driver's license number,
    and residential address, along with the verification status, result, completion
    timestamp, and any manual adjudication notes. The data originates from Checkr's
    verification process, linking each report to a specific driver within the organization's
    system.
  table_name: '{silver_layer}_checkr_driver_verifications'
  system: checkr
  domain: operations

model:
  fields:
  - name: report_id
    type: string
    required: true
    description: Unique identifier for the background check report generated by Checkr.
  - name: driver_id
    type: string
    required: true
    description: Identifier linking the verification to a specific driver within the
      organization's system.
  - name: full_name
    type: string
    required: false
    pii: true
    classification: person_name
    description: Full legal name of the driver as provided during the verification
      process.
  - name: date_of_birth
    type: string
    required: false
    pii: true
    classification: date_of_birth
    description: Driver's date of birth used for identity verification and matching
      records.
  - name: ssn_last_four
    type: string
    required: false
    pii: true
    classification: national_id
    description: Last four digits of the driver's Social Security Number used for
      identity confirmation.
  - name: licence_number
    type: string
    required: false
    pii: true
    classification: licence_id
    description: Driver's vehicle license number verified as part of the background
      check.
  - name: address
    type: string
    required: false
    pii: true
    classification: postal_address
    description: Current residential address of the driver used for verification purposes.
  - name: status
    type: string
    required: false
    description: Current status of the background check (e.g., pending, completed,
      flagged).
  - name: result
    type: string
    required: false
    description: Outcome of the verification process indicating pass, fail, or other
      relevant result.
  - name: completed_at
    type: timestamp
    required: false
    description: Timestamp indicating when the background check was completed.
  - name: created_at
    type: timestamp
    required: false
    description: Timestamp indicating when the background check request was created.
  - name: adjudication
    type: string
    required: false
    description: Details of any manual review or decision made regarding the verification
      results.
  - name: completed_date
    type: date
    required: false
    description: 'Partition column: the calendar date of `completed_at`.'

primary_key:
- report_id

quality:
  row_rules:
  - name: report_id_not_null
    sql: report_id IS NOT NULL
    category: completeness
    description: report_id is always present (never null).
  - name: driver_id_not_null
    sql: driver_id IS NOT NULL
    category: completeness
    description: driver_id is always present (never null).
  - name: report_id_not_null
    sql: report_id IS NOT NULL
    category: completeness
    description: report_id is always present (never null).

transformations:
- phase: pre
  derive:
    field: completed_date
    sql: CAST(completed_at AS DATE)
- deduplicate:
    by:
    - report_id
    sort_by:
    - completed_at
    order: desc

materialization:
  partition_by:
  - completed_date

dataset: silver_checkr_driver_verifications

source:
  type: table
  path: table:{domain_catalog}.{bronze_layer}_checkr_driver_verifications
  load_mode: incremental
  watermark_field: _lakelogic_processed_at

metadata:
  run_log_table: '{domain_catalog}.lakelogic_run_log'
