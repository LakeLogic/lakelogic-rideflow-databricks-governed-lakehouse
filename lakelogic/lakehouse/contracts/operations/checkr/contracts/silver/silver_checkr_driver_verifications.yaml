version: 1.0.0

info:
  title: Silver — Checkr Driver Verifications
  target_layer: silver
  table_name: '{silver_layer}_checkr_driver_verifications'
  system: checkr
  domain: operations

model:
  fields:
  - name: report_id
    type: string
    required: true
  - name: driver_id
    type: string
    required: true
  - name: full_name
    type: string
    required: false
    pii: true
    classification: person_name
    description: Personal data (person_name), real values here, masked at gold (redact).
  - name: date_of_birth
    type: string
    required: false
    pii: true
    classification: date_of_birth
    description: Personal data (date_of_birth), real values here, masked at gold (nullify).
  - name: ssn_last_four
    type: string
    required: false
    pii: true
    classification: national_id
    description: Personal data (national_id), real values here, masked at gold (hash).
  - name: licence_number
    type: string
    required: false
    pii: true
    classification: licence_id
    description: Personal data (licence_id), real values here, masked at gold (hash).
  - name: address
    type: string
    required: false
    pii: true
    classification: postal_address
    description: Personal data (postal_address), real values here, masked at gold
      (redact).
  - name: status
    type: string
    required: false
  - name: result
    type: string
    required: false
  - name: completed_at
    type: timestamp
    required: false
  - name: created_at
    type: timestamp
    required: false
  - name: adjudication
    type: string
    required: false
  - name: completed_date
    type: date
    required: false
    description: 'Partition column: the calendar date of `completed_at`.'

primary_key:
- report_id

quality:
  row_rules:
  - name: report_id_not_null
    sql: report_id IS NOT NULL
    category: completeness
    description: report_id is always present (never null).
  - name: driver_id_not_null
    sql: driver_id IS NOT NULL
    category: completeness
    description: driver_id is always present (never null).
  - name: report_id_not_null
    sql: report_id IS NOT NULL
    category: completeness
    description: report_id is always present (never null).

transformations:
- phase: pre
  derive:
    field: completed_date
    sql: CAST(completed_at AS DATE)
- deduplicate:
    by:
    - report_id
    sort_by:
    - completed_at
    order: desc

materialization:
  partition_by:
  - completed_date

dataset: silver_checkr_driver_verifications

source:
  type: table
  path: table:{domain_catalog}.{bronze_layer}_checkr_driver_verifications
  load_mode: incremental
  watermark_field: _lakelogic_processed_at

metadata:
  run_log_table: '{domain_catalog}.lakelogic_run_log'
