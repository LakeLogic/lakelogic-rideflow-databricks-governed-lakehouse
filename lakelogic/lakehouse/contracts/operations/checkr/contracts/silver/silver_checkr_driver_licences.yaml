version: 1.0.0

info:
  title: Silver — Checkr Driver Licences
  target_layer: silver
  description: The table contains personal information and licence details for drivers,
    including their full name, date of birth, and licence number, which are used to
    verify identity, age, and licence validity. It also records the expiry date of
    the licence and the vehicle classes the driver is authorised to operate, ensuring
    compliance and safety. This data originates from Checkr and is marked for operations,
    with strict quality checks to ensure the licence number is always present.
  table_name: '{silver_layer}_checkr_driver_licences'
  system: checkr
  domain: operations

model:
  fields:
  - name: full_name
    type: string
    required: false
    pii: true
    classification: person_name
    description: The full name of the driver, used to identify the licence holder.
  - name: licence_number
    type: string
    required: true
    pii: true
    classification: licence_id
    description: The unique identifier for the driver's licence, used for verification
      and record-keeping.
  - name: date_of_birth
    type: string
    required: false
    pii: true
    classification: date_of_birth
    description: The date of birth of the driver, used to confirm identity and age
      requirements.
  - name: expiry_date
    type: date
    required: false
    description: The date when the driver's licence expires, important for compliance
      and safety checks.
  - name: vehicle_classes
    type: string
    required: false
    description: The types of vehicles the driver is licensed to operate, relevant
      for determining driving eligibility and restrictions.

primary_key:
- licence_number

quality:
  row_rules:
  - name: licence_number_not_null
    sql: licence_number IS NOT NULL
    category: completeness
    description: licence_number is always present (never null).
  - name: licence_number_not_null
    sql: licence_number IS NOT NULL
    category: completeness
    description: licence_number is always present (never null).

transformations:
- deduplicate:
    by:
    - licence_number
    sort_by:
    - _lakelogic_processed_at
    order: desc

dataset: silver_checkr_driver_licences

source:
  type: table
  path: table:{domain_catalog}.{bronze_layer}_checkr_driver_licences
  load_mode: incremental
  watermark_field: _lakelogic_processed_at

metadata:
  run_log_table: '{domain_catalog}.lakelogic_run_log'
