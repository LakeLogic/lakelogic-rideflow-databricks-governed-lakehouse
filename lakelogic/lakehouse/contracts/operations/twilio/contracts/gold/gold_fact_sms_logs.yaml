version: 1.0.0

info:
  title: Gold — Fact Sms Logs
  target_layer: gold
  description: 'grain: one row per SMS message'
  table_name: '{gold_layer}_fact_sms_logs'
  system: twilio
  domain: operations

model:
  fields:
  - name: message_sid
    type: string
    required: true
    description: Unique identifier for the SMS message, used to track and reference
      individual messages.
  - name: total_cost
    type: float
    required: false
  - name: message_body
    type: string
    required: false
    description: Content of the SMS message, including any text or media sent.
  - name: status
    type: string
    required: false
    description: Current status of the SMS message (e.g., sent, delivered, failed),
      indicating message delivery outcome.
  - name: direction
    type: string
    required: false
    description: Direction of the message (inbound or outbound), showing whether the
      message was sent from or received by the system.
  - name: num_segments
    type: integer
    required: false
    description: Number of segments the SMS message was split into, affecting cost
      and delivery.
  - name: error_code
    type: string
    required: false
    description: Error code returned if the SMS message failed to send or deliver,
      helping diagnose issues.
  - name: sent_at
    type: timestamp
    required: false
    description: Timestamp indicating when the SMS message was sent, recording the
      dispatch time.
  - name: delivered_at
    type: timestamp
    required: false
    description: Timestamp indicating when the SMS message was delivered, recording
      the delivery time.
  - name: delivered_date
    type: date
    required: false
    description: 'Partition column: the calendar date of `delivered_at`.'
  - name: system
    type: string
    required: true
    description: Source system this row came from

dataset: gold_fact_sms_logs

primary_key:
- message_sid

quality:
  dataset_rules:
  - unique:
      columns:
      - message_sid
      name: message_sid_unique
      category: uniqueness
      description: No two rows share the same message_sid.

transformations:
- phase: pre
  sql: |-
    SELECT
      r.message_sid,
      r.message_body,
      r.status,
      r.direction,
      r.num_segments,
      r.error_code,
      r.sent_at,
      r.delivered_at,
      r.price AS total_cost,
      CAST(r.delivered_at AS DATE) AS delivered_date
    FROM source r
- phase: pre
  derive:
    field: system
    sql: '''twilio'''

materialization:
  strategy: append
  fact:
    type: transaction
  partition_by:
  - delivered_date

source:
  type: table
  path: table:{domain_catalog}.{silver_layer}_twilio_sms_logs
  load_mode: incremental
  watermark_field: _lakelogic_processed_at

metadata:
  run_log_table: '{domain_catalog}.lakelogic_run_log'
