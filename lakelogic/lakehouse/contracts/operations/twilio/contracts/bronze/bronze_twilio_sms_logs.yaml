version: 1.0.0

info:
  title: Bronze — Twilio Sms Logs
  target_layer: bronze
  description: The table records each individual SMS message sent or received through
    Twilio, capturing essential details such as the recipient's and sender's phone
    numbers, message content, delivery status, and associated cost. It includes timestamps
    for when messages were sent and delivered, along with any error codes that arise
    during transmission. This data helps track communication effectiveness and financial
    impact for operational monitoring.
  table_name: '{bronze_layer}_twilio_sms_logs'
  domain: operations
  system: twilio

model:
  fields:
  - name: message_sid
    type: string
    description: Unique identifier for the SMS message, used to track and reference
      individual messages.
  - name: recipient_phone
    type: string
    pii: true
    classification: phone
    description: Phone number of the message recipient, indicating who received the
      SMS.
  - name: sender_phone
    type: string
    pii: true
    classification: phone
    description: Phone number of the message sender, indicating who initiated the
      SMS.
  - name: message_body
    type: string
    description: Content of the SMS message, including any text or media sent.
  - name: status
    type: string
    description: Current status of the SMS message (e.g., sent, delivered, failed),
      indicating message delivery outcome.
  - name: direction
    type: string
    description: Direction of the message (inbound or outbound), showing whether the
      message was sent from or received by the system.
  - name: num_segments
    type: integer
    description: Number of segments the SMS message was split into, affecting cost
      and delivery.
  - name: price
    type: float
    description: Cost of sending the SMS message, representing the monetary charge
      incurred.
  - name: price_unit
    type: string
    description: Currency unit for the price (e.g., USD, EUR), specifying the currency
      used for billing.
  - name: sent_at
    type: timestamp
    description: Timestamp indicating when the SMS message was sent, recording the
      dispatch time.
  - name: delivered_at
    type: timestamp
    description: Timestamp indicating when the SMS message was delivered, recording
      the delivery time.
  - name: error_code
    type: string
    description: Error code returned if the SMS message failed to send or deliver,
      helping diagnose issues.

source:
  type: landing
  path: '{landing_root}/sms_logs'
  load_mode: full

primary_key:
- message_sid

dataset: bronze_twilio_sms_logs
