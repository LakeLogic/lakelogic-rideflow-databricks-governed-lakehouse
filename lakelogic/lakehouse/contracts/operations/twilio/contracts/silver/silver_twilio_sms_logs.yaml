version: 1.0.0

info:
  title: Silver — Twilio Sms Logs
  target_layer: silver
  description: The table holds detailed logs of SMS messages exchanged through Twilio,
    including sender and recipient phone numbers, message content, delivery status,
    cost, and timestamps for sending and delivery. It captures personal data in the
    form of phone numbers and includes financial information such as the cost per
    message and currency. The data originates from Twilio's operational logs, tracking
    each SMS message's lifecycle from dispatch to delivery or failure.
  table_name: '{silver_layer}_twilio_sms_logs'
  system: twilio
  domain: operations

model:
  fields:
  - name: message_sid
    type: string
    required: true
    description: Unique identifier for the SMS message, used to track and reference
      individual messages.
  - name: recipient_phone
    type: string
    required: false
    pii: true
    classification: phone
    description: Phone number of the message recipient, indicating who received the
      SMS.
  - name: sender_phone
    type: string
    required: false
    pii: true
    classification: phone
    description: Phone number of the message sender, indicating who initiated the
      SMS.
  - name: message_body
    type: string
    required: false
    description: Content of the SMS message, including any text or media sent.
  - name: status
    type: string
    required: false
    description: Current status of the SMS message (e.g., sent, delivered, failed),
      indicating message delivery outcome.
  - name: direction
    type: string
    required: false
    description: Direction of the message (inbound or outbound), showing whether the
      message was sent from or received by the system.
  - name: num_segments
    type: integer
    required: false
    description: Number of segments the SMS message was split into, affecting cost
      and delivery.
  - name: price
    type: float
    required: false
    description: Cost of sending the SMS message, representing the monetary charge
      incurred.
  - name: price_unit
    type: float
    required: false
    description: Currency unit for the price (e.g., USD, EUR), specifying the currency
      used for billing.
  - name: sent_at
    type: timestamp
    required: false
    description: Timestamp indicating when the SMS message was sent, recording the
      dispatch time.
  - name: delivered_at
    type: timestamp
    required: false
    description: Timestamp indicating when the SMS message was delivered, recording
      the delivery time.
  - name: error_code
    type: string
    required: false
    description: Error code returned if the SMS message failed to send or deliver,
      helping diagnose issues.
  - name: delivered_date
    type: date
    required: false
    description: 'Partition column: the calendar date of `delivered_at`.'

primary_key:
- message_sid

quality:
  row_rules:
  - name: message_sid_not_null
    sql: message_sid IS NOT NULL
    category: completeness
    description: message_sid is always present (never null).
  - name: message_sid_not_null
    sql: message_sid IS NOT NULL
    category: completeness
    description: message_sid is always present (never null).

transformations:
- phase: pre
  derive:
    field: delivered_date
    sql: CAST(delivered_at AS DATE)
- deduplicate:
    by:
    - message_sid
    sort_by:
    - _lakelogic_processed_at
    order: desc

materialization:
  partition_by:
  - delivered_date

dataset: silver_twilio_sms_logs

source:
  type: table
  path: table:{domain_catalog}.{bronze_layer}_twilio_sms_logs
  load_mode: incremental
  watermark_field: _lakelogic_processed_at

metadata:
  run_log_table: '{domain_catalog}.lakelogic_run_log'
