version: 1.0.0

info:
  title: Silver — Stripe Payouts
  target_layer: silver
  description: The table holds processed payment details from Stripe, including the
    payout amount, currency, status, and associated driver's identifier. It contains
    personal data such as the payout recipient's email and the last four digits of
    their bank account, along with timestamps for when each payout record was created
    and when funds are scheduled to arrive. Each record is uniquely identified and
    linked to a specific driver, ensuring accurate tracking and auditing of financial
    transactions.
  table_name: '{silver_layer}_stripe_payouts'
  system: stripe
  domain: payments

model:
  fields:
  - name: payout_id
    type: string
    required: true
    description: Unique identifier for the Stripe payout transaction, used to track
      and reference each payout record.
  - name: driver_id
    type: string
    required: true
    description: Identifier for the driver associated with the payout, linking the
      payment to the specific driver who earned it.
  - name: amount
    type: float
    required: false
    description: The monetary amount of the payout, representing the total payment
      processed.
  - name: currency
    type: string
    required: false
    description: The currency in which the payout amount is processed, indicating
      the monetary unit used for the transaction.
  - name: status
    type: string
    required: false
    description: Current status of the payout (e.g., paid, pending, failed), showing
      the progress or outcome of the payment.
  - name: payout_email
    type: string
    required: false
    pii: true
    classification: email
    description: 'Email address associated with the payout, used for communication
      regarding the payment (note: contains personal data).'
  - name: bank_account_last_four
    type: string
    required: false
    sensitive: true
    classification: financial_account
    description: 'Last four digits of the bank account used for the payout, for verification
      and reference purposes (note: contains confidential financial information).'
  - name: arrival_date
    type: date
    required: false
    description: The date when the payout funds are scheduled to arrive in the destination
      account.
  - name: created_at
    type: timestamp
    required: false
    description: Timestamp indicating when the payout record was created, useful for
      tracking and auditing purposes.
  - name: created_date
    type: date
    required: false
    description: 'Partition column: the calendar date of `created_at`.'

primary_key:
- payout_id

quality:
  row_rules:
  - name: payout_id_not_null
    sql: payout_id IS NOT NULL
    category: completeness
    description: payout_id is always present (never null).
  - name: driver_id_not_null
    sql: driver_id IS NOT NULL
    category: completeness
    description: driver_id is always present (never null).
  - name: payout_id_not_null
    sql: payout_id IS NOT NULL
    category: completeness
    description: payout_id is always present (never null).

transformations:
- phase: pre
  derive:
    field: created_date
    sql: CAST(created_at AS DATE)
- deduplicate:
    by:
    - payout_id
    sort_by:
    - arrival_date
    order: desc

materialization:
  partition_by:
  - created_date

dataset: silver_stripe_payouts

source:
  type: table
  path: table:{domain_catalog}.{bronze_layer}_stripe_payouts
  load_mode: incremental
  watermark_field: _lakelogic_processed_at

metadata:
  run_log_table: '{domain_catalog}.lakelogic_run_log'
