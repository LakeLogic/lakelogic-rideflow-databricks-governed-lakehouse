version: 1.0.0

info:
  title: Silver — Stripe Refunds
  target_layer: silver
  description: The table records financial refunds processed through Stripe, capturing
    essential details such as the refund amount and currency, the associated charge
    and rider identifiers, the refund status, and the reasons for the refund, both
    from Stripe and internally, along with timestamps for when refunds were initiated.
  table_name: '{silver_layer}_stripe_refunds'
  system: stripe
  domain: payments

model:
  fields:
  - name: refund_id
    type: string
    required: true
    description: Unique identifier for the refund transaction, essential for tracking
      and referencing specific refund actions.
  - name: charge_id
    type: string
    required: true
    description: Identifier linking the refund to the original charge, enabling traceability
      back to the payment transaction.
  - name: rider_id
    type: string
    required: true
    description: Identifier for the rider associated with the refund, used for linking
      refunds to specific service providers or users.
  - name: amount
    type: float
    required: false
    description: Monetary value of the refund, indicating the amount being returned
      to the customer.
  - name: currency
    type: string
    required: false
    description: Currency in which the refund is processed, important for financial
      reporting and multi-currency transactions.
  - name: status
    type: string
    required: false
    description: Current state of the refund process, indicating whether it is succeeded,
      failed, or pending.
  - name: reason
    type: string
    required: false
    description: Reason provided by Stripe for the refund, offering insight into why
      the refund was issued.
  - name: refund_reason
    type: string
    required: false
    description: Custom or detailed reason for the refund as recorded by the business,
      supporting internal analysis and customer service.
  - name: created_at
    type: timestamp
    required: false
    description: Timestamp indicating when the refund was initiated, crucial for auditing
      and time-based analysis.
  - name: created_date
    type: date
    required: false
    description: 'Partition column: the calendar date of `created_at`.'

primary_key:
- refund_id

quality:
  row_rules:
  - name: refund_id_not_null
    sql: refund_id IS NOT NULL
    category: completeness
    description: refund_id is always present (never null).
  - name: charge_id_not_null
    sql: charge_id IS NOT NULL
    category: completeness
    description: charge_id is always present (never null).
  - name: rider_id_not_null
    sql: rider_id IS NOT NULL
    category: completeness
    description: rider_id is always present (never null).
  - name: refund_id_not_null
    sql: refund_id IS NOT NULL
    category: completeness
    description: refund_id is always present (never null).

transformations:
- phase: pre
  derive:
    field: created_date
    sql: CAST(created_at AS DATE)
- deduplicate:
    by:
    - refund_id
    sort_by:
    - created_at
    order: desc

materialization:
  partition_by:
  - created_date

dataset: silver_stripe_refunds

source:
  type: table
  path: table:{domain_catalog}.{bronze_layer}_stripe_refunds
  load_mode: incremental
  watermark_field: _lakelogic_processed_at

metadata:
  run_log_table: '{domain_catalog}.lakelogic_run_log'
