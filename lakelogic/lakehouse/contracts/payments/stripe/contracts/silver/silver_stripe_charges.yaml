version: 1.0.0

info:
  title: Silver — Stripe Charges
  target_layer: silver
  description: The table contains detailed records of payment transactions processed
    through Stripe, including identifiers for both the payment and the associated
    rider and trip, the monetary value and currency of each charge, payment method
    details, and billing contact information. It captures essential data such as the
    charge status, timestamps for when payments were created, and additional metadata,
    with sensitive information like the last four digits of the payment card and personally
    identifiable information such as billing email and address included for verification
    and communication purposes.
  table_name: '{silver_layer}_stripe_charges'
  system: stripe
  domain: payments

model:
  fields:
  - name: charge_id
    type: string
    required: true
    description: Unique identifier for the Stripe charge, used to reference and track
      each payment transaction.
  - name: rider_id
    type: string
    required: true
    description: Identifier for the rider associated with the payment, linking the
      charge to a specific customer.
  - name: trip_id
    type: string
    required: true
    description: Identifier for the trip associated with the payment, connecting the
      charge to a specific service provided.
  - name: amount
    type: float
    required: false
    description: The monetary value of the charge, indicating how much was paid.
  - name: currency
    type: string
    required: false
    description: The currency in which the charge was made, important for financial
      reporting and conversions.
  - name: status
    type: string
    required: false
    description: The current status of the charge (e.g., succeeded, failed), indicating
      the success of the payment process.
  - name: payment_method_type
    type: string
    required: false
    description: The type of payment method used (e.g., card, digital wallet), helping
      categorize payment transactions.
  - name: card_last_four
    type: string
    required: false
    sensitive: true
    classification: financial_account
    description: The last four digits of the card used for the payment, useful for
      verification and reference while maintaining confidentiality.
  - name: billing_email
    type: string
    required: false
    pii: true
    classification: email
    description: The email address associated with the billing account, used for communication
      regarding the payment.
  - name: billing_address
    type: string
    required: false
    pii: true
    classification: postal_address
    description: The postal address associated with the billing account, used for
      verification and record-keeping.
  - name: created_at
    type: timestamp
    required: false
    description: The timestamp indicating when the charge was created, essential for
      tracking and auditing purposes.
  - name: metadata_json
    type: string
    required: false
    description: Additional metadata related to the charge, providing extra context
      or information in a structured format.
  - name: created_date
    type: date
    required: false
    description: 'Partition column: the calendar date of `created_at`.'

primary_key:
- charge_id

quality:
  row_rules:
  - name: charge_id_not_null
    sql: charge_id IS NOT NULL
    category: completeness
    description: charge_id is always present (never null).
  - name: rider_id_not_null
    sql: rider_id IS NOT NULL
    category: completeness
    description: rider_id is always present (never null).
  - name: trip_id_not_null
    sql: trip_id IS NOT NULL
    category: completeness
    description: trip_id is always present (never null).
  - name: charge_id_not_null
    sql: charge_id IS NOT NULL
    category: completeness
    description: charge_id is always present (never null).

transformations:
- phase: pre
  derive:
    field: created_date
    sql: CAST(created_at AS DATE)
- deduplicate:
    by:
    - charge_id
    sort_by:
    - created_at
    order: desc

materialization:
  partition_by:
  - created_date

dataset: silver_stripe_charges

source:
  type: table
  path: table:{domain_catalog}.{bronze_layer}_stripe_charges
  load_mode: incremental
  watermark_field: _lakelogic_processed_at

metadata:
  run_log_table: '{domain_catalog}.lakelogic_run_log'
