version: 1.0.0

info:
  title: Bronze — Stripe Charges
  target_layer: bronze
  description: The table holds payment transaction records from Stripe, including
    details such as the charge amount, currency, payment status, and the payment method
    used, along with sensitive information like the last four digits of the card and
    personally identifiable information such as billing email and address. Each record
    is linked to a specific rider and trip, enabling traceability of payments to individual
    customers and services provided. The data captures essential financial and transactional
    metadata necessary for auditing, verification, and financial reporting.
  table_name: '{bronze_layer}_stripe_charges'
  domain: payments
  system: stripe

model:
  fields:
  - name: charge_id
    type: string
    description: Unique identifier for the Stripe charge, used to reference and track
      each payment transaction.
  - name: rider_id
    type: string
    description: Identifier for the rider associated with the payment, linking the
      charge to a specific customer.
  - name: trip_id
    type: string
    description: Identifier for the trip associated with the payment, connecting the
      charge to a specific service provided.
  - name: amount
    type: float
    description: The monetary value of the charge, indicating how much was paid.
  - name: currency
    type: string
    description: The currency in which the charge was made, important for financial
      reporting and conversions.
  - name: status
    type: string
    description: The current status of the charge (e.g., succeeded, failed), indicating
      the success of the payment process.
  - name: payment_method_type
    type: string
    description: The type of payment method used (e.g., card, digital wallet), helping
      categorize payment transactions.
  - name: card_last_four
    type: string
    sensitive: true
    classification: financial_account
    description: The last four digits of the card used for the payment, useful for
      verification and reference while maintaining confidentiality.
  - name: billing_email
    type: string
    pii: true
    classification: email
    description: The email address associated with the billing account, used for communication
      regarding the payment.
  - name: billing_address
    type: string
    pii: true
    classification: postal_address
    description: The postal address associated with the billing account, used for
      verification and record-keeping.
  - name: created_at
    type: timestamp
    description: The timestamp indicating when the charge was created, essential for
      tracking and auditing purposes.
  - name: metadata_json
    type: string
    description: Additional metadata related to the charge, providing extra context
      or information in a structured format.

source:
  type: landing
  path: '{landing_root}/charges'
  load_mode: full

dataset: bronze_stripe_charges
