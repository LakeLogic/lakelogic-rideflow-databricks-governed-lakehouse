version: 1.0.0

info:
  title: Gold — Fact Payouts
  target_layer: gold
  description: 'grain: one row per payout'
  table_name: '{gold_layer}_fact_payouts'
  system: stripe
  domain: payments

model:
  fields:
  - name: payout_id
    type: string
    required: true
    description: Unique identifier for the Stripe payout transaction, used to track
      and reference each payout record.
  - name: total_payout_amount
    type: float
    required: false
  - name: status
    type: string
    required: false
    description: Current status of the payout (e.g., paid, pending, failed), showing
      the progress or outcome of the payment.
  - name: currency
    type: string
    required: false
    description: The currency in which the payout amount is processed, indicating
      the monetary unit used for the transaction.
  - name: arrival_date
    type: date
    required: false
    description: The date when the payout funds are scheduled to arrive in the destination
      account.
  - name: created_at
    type: timestamp
    required: false
    description: Timestamp indicating when the payout record was created, useful for
      tracking and auditing purposes.
  - name: created_date
    type: date
    required: false
    description: 'Partition column: the calendar date of `created_at`.'
  - name: system
    type: string
    required: true
    description: Source system this row came from

dataset: gold_fact_payouts

primary_key:
- payout_id

quality:
  dataset_rules:
  - unique:
      columns:
      - payout_id
      name: payout_id_unique
      category: uniqueness
      description: No two rows share the same payout_id.

transformations:
- phase: pre
  sql: |-
    SELECT
      r.payout_id,
      r.status,
      r.currency,
      r.arrival_date,
      r.created_at,
      r.amount AS total_payout_amount,
      CAST(r.created_at AS DATE) AS created_date
    FROM source r
- phase: pre
  derive:
    field: system
    sql: '''stripe'''

materialization:
  strategy: append
  fact:
    type: transaction
  partition_by:
  - created_date

source:
  type: table
  path: table:{domain_catalog}.{silver_layer}_stripe_payouts
  load_mode: incremental
  watermark_field: _lakelogic_processed_at

metadata:
  run_log_table: '{domain_catalog}.lakelogic_run_log'
