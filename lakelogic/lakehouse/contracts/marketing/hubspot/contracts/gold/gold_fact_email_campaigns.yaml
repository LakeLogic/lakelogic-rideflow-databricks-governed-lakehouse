version: 1.0.0

info:
  title: Gold — Fact Email Campaigns
  target_layer: gold
  description: 'grain: one row per email campaign recipient'
  table_name: '{gold_layer}_fact_email_campaigns'
  system: hubspot
  domain: marketing

model:
  fields:
  - name: campaign_id
    type: string
    required: true
    description: Unique identifier for the email campaign, used to track and correlate
      campaign performance.
  - name: recipient_email
    type: string
    required: true
    pii: true
    masking: hash
    classification: email
    description: Email address of the recipient, essential for personalization and
      communication.
  - name: recipient_name
    type: string
    required: false
    description: Name of the recipient, used for personalized messaging and tracking.
  - name: campaign_name
    type: string
    required: false
    description: Name of the email campaign, helps in identifying and organizing marketing
      efforts.
  - name: subject_line
    type: string
    required: false
    description: Subject line of the email, crucial for determining open rates and
      engagement.
  - name: sent_at
    type: timestamp
    required: false
    description: Timestamp indicating when the email was sent to the recipient.
  - name: opened_at
    type: timestamp
    required: false
    description: Timestamp indicating when the recipient opened the email, useful
      for measuring engagement.
  - name: clicked_at
    type: timestamp
    required: false
    description: Timestamp indicating when the recipient clicked a link within the
      email, indicating interest.
  - name: bounced
    type: boolean
    required: false
    description: Boolean indicating whether the email bounced, important for understanding
      delivery issues.
  - name: unsubscribed
    type: boolean
    required: false
    description: Boolean indicating whether the recipient unsubscribed after receiving
      the email, important for managing opt-outs.
  - name: sent_date
    type: date
    required: false
    description: 'Partition column: the calendar date of `sent_at`.'
  - name: system
    type: string
    required: true
    description: Source system this row came from

dataset: gold_fact_email_campaigns

primary_key:
- campaign_id
- recipient_email

quality:
  dataset_rules:
  - unique:
      columns:
      - campaign_id
      - recipient_email
      name: campaign_id_recipient_email_unique
      category: uniqueness
      description: No two rows share the same campaign_id, recipient_email.

transformations:
- phase: pre
  sql: |-
    SELECT
      r.campaign_id,
      r.recipient_email,
      r.recipient_name,
      r.campaign_name,
      r.subject_line,
      r.sent_at,
      r.opened_at,
      r.clicked_at,
      r.bounced,
      r.unsubscribed,
      CAST(r.sent_at AS DATE) AS sent_date
    FROM source r
- phase: pre
  derive:
    field: system
    sql: '''hubspot'''

materialization:
  strategy: append
  fact:
    type: factless
  partition_by:
  - sent_date

source:
  type: table
  path: table:{domain_catalog}.{silver_layer}_hubspot_email_campaigns
  load_mode: incremental
  watermark_field: _lakelogic_processed_at

metadata:
  run_log_table: '{domain_catalog}.lakelogic_run_log'
