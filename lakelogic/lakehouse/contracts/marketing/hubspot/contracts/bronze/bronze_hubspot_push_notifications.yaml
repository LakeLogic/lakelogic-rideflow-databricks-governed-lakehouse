version: 1.0.0

info:
  title: Bronze — Hubspot Push Notifications
  target_layer: bronze
  description: The table records each push notification sent through Hubspot to riders,
    capturing details such as the unique notification identifier, the rider and device
    it was sent to, the associated marketing campaign, and timestamps for when it
    was sent, delivered, and opened, along with the platform used. It links marketing
    messages directly to individual riders and their devices, enabling tracking of
    message delivery and engagement. The data includes personal identifiers for riders
    and devices, as well as campaign information for performance analysis.
  table_name: '{bronze_layer}_hubspot_push_notifications'
  domain: marketing
  system: hubspot

model:
  fields:
  - name: notification_id
    type: string
    description: Unique identifier for the push notification sent through Hubspot,
      used to track and reference each individual message.
  - name: rider_id
    type: string
    description: Identifier for the rider who received the push notification, linking
      the message to a specific user.
  - name: device_token
    type: string
    description: Token representing the device (e.g., mobile phone) that the push
      notification was sent to, enabling targeted delivery.
  - name: campaign_name
    type: string
    description: Name of the marketing campaign associated with the push notification,
      helping to categorize and analyze campaign performance.
  - name: sent_at
    type: timestamp
    description: Timestamp indicating when the push notification was dispatched from
      Hubspot to the rider's device.
  - name: delivered_at
    type: timestamp
    description: Timestamp showing when the push notification was successfully delivered
      to the rider's device.
  - name: opened_at
    type: timestamp
    description: Timestamp capturing when the rider opened the push notification,
      indicating engagement with the message.
  - name: platform
    type: string
    description: Platform (e.g., iOS, Android) on which the push notification was
      delivered, useful for analyzing delivery and engagement metrics across different
      devices.

source:
  type: landing
  path: '{landing_root}/push_notifications'
  load_mode: full

dataset: bronze_hubspot_push_notifications
