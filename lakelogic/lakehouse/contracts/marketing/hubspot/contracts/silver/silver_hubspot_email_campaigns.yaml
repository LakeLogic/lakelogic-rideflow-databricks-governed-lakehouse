version: 1.0.0

info:
  title: Silver — Hubspot Email Campaigns
  target_layer: silver
  description: The table holds detailed records of email campaigns sent through Hubspot,
    including recipient information and engagement metrics. It captures essential
    data such as the recipient's email address and name, the campaign name, subject
    line, and timestamps for when emails were sent, opened, or clicked. The data also
    tracks delivery issues and recipient unsubscribes, providing insights into campaign
    performance and recipient interaction.
  table_name: '{silver_layer}_hubspot_email_campaigns'
  system: hubspot
  domain: marketing

model:
  fields:
  - name: campaign_id
    type: string
    required: true
    description: Unique identifier for the email campaign, used to track and correlate
      campaign performance.
  - name: recipient_email
    type: string
    required: false
    pii: true
    classification: email
    description: Email address of the recipient, essential for personalization and
      communication.
  - name: recipient_name
    type: string
    required: false
    description: Name of the recipient, used for personalized messaging and tracking.
  - name: campaign_name
    type: string
    required: false
    description: Name of the email campaign, helps in identifying and organizing marketing
      efforts.
  - name: subject_line
    type: string
    required: false
    description: Subject line of the email, crucial for determining open rates and
      engagement.
  - name: sent_at
    type: timestamp
    required: false
    description: Timestamp indicating when the email was sent to the recipient.
  - name: opened_at
    type: timestamp
    required: false
    description: Timestamp indicating when the recipient opened the email, useful
      for measuring engagement.
  - name: clicked_at
    type: timestamp
    required: false
    description: Timestamp indicating when the recipient clicked a link within the
      email, indicating interest.
  - name: bounced
    type: boolean
    required: false
    description: Boolean indicating whether the email bounced, important for understanding
      delivery issues.
  - name: unsubscribed
    type: boolean
    required: false
    description: Boolean indicating whether the recipient unsubscribed after receiving
      the email, important for managing opt-outs.
  - name: sent_date
    type: date
    required: false
    description: 'Partition column: the calendar date of `sent_at`.'

primary_key:
- campaign_id

quality:
  row_rules:
  - name: campaign_id_not_null
    sql: campaign_id IS NOT NULL
    category: completeness
    description: campaign_id is always present (never null).
  - name: campaign_id_not_null
    sql: campaign_id IS NOT NULL
    category: completeness
    description: campaign_id is always present (never null).

transformations:
- phase: pre
  derive:
    field: sent_date
    sql: CAST(sent_at AS DATE)
- deduplicate:
    by:
    - campaign_id
    sort_by:
    - clicked_at
    order: desc

materialization:
  partition_by:
  - sent_date

dataset: silver_hubspot_email_campaigns

source:
  type: table
  path: table:{domain_catalog}.{bronze_layer}_hubspot_email_campaigns
  load_mode: incremental
  watermark_field: _lakelogic_processed_at

metadata:
  run_log_table: '{domain_catalog}.lakelogic_run_log'
