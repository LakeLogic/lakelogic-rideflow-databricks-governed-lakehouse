version: 1.0.0

info:
  title: Silver — Hubspot Push Notifications
  target_layer: silver
  table_name: '{silver_layer}_hubspot_push_notifications'
  system: hubspot
  domain: marketing

model:
  fields:
  - name: notification_id
    type: string
    required: true
    description: Unique identifier for the push notification sent through Hubspot,
      used to track and reference each individual message.
  - name: rider_id
    type: string
    required: true
    description: Identifier for the rider who received the push notification, linking
      the message to a specific user.
  - name: device_token
    type: string
    required: false
    description: Token representing the device (e.g., mobile phone) that the push
      notification was sent to, enabling targeted delivery.
  - name: campaign_name
    type: string
    required: false
    description: Name of the marketing campaign associated with the push notification,
      helping to categorize and analyze campaign performance.
  - name: sent_at
    type: timestamp
    required: false
    description: Timestamp indicating when the push notification was dispatched from
      Hubspot to the rider's device.
  - name: delivered_at
    type: timestamp
    required: false
    description: Timestamp showing when the push notification was successfully delivered
      to the rider's device.
  - name: opened_at
    type: timestamp
    required: false
    description: Timestamp capturing when the rider opened the push notification,
      indicating engagement with the message.
  - name: platform
    type: string
    required: false
    description: Platform (e.g., iOS, Android) on which the push notification was
      delivered, useful for analyzing delivery and engagement metrics across different
      devices.
  - name: delivered_date
    type: date
    required: false
    description: 'Partition column: the calendar date of `delivered_at`.'

primary_key:
- notification_id

quality:
  row_rules:
  - name: notification_id_not_null
    sql: notification_id IS NOT NULL
    category: completeness
    description: notification_id is always present (never null).
  - name: rider_id_not_null
    sql: rider_id IS NOT NULL
    category: completeness
    description: rider_id is always present (never null).
  - name: notification_id_not_null
    sql: notification_id IS NOT NULL
    category: completeness
    description: notification_id is always present (never null).

transformations:
- phase: pre
  derive:
    field: delivered_date
    sql: CAST(delivered_at AS DATE)
- deduplicate:
    by:
    - notification_id
    sort_by:
    - delivered_at
    order: desc

materialization:
  partition_by:
  - delivered_date

dataset: silver_hubspot_push_notifications

source:
  type: table
  path: table:{domain_catalog}.{bronze_layer}_hubspot_push_notifications
  load_mode: incremental
  watermark_field: _lakelogic_processed_at

metadata:
  run_log_table: '{domain_catalog}.lakelogic_run_log'
