version: 1.0.0

info:
  title: Bronze — Google Ads Campaigns
  target_layer: bronze
  description: The table records performance metrics for individual advertising campaigns
    and their ad groups from Google Ads, capturing essential data such as impressions,
    clicks, costs, and conversions to evaluate the effectiveness and financial impact
    of marketing efforts over specific dates.
  table_name: '{bronze_layer}_google_ads_campaigns'
  domain: marketing
  system: google_ads

model:
  fields:
  - name: campaign_id
    type: string
    description: Unique identifier for the campaign, used to distinguish and track
      individual advertising efforts.
  - name: campaign_name
    type: string
    description: Name of the campaign, providing a human-readable label for marketing
      activities.
  - name: ad_group_id
    type: string
    description: Unique identifier for the ad group within the campaign, organizing
      ads into manageable segments.
  - name: ad_group_name
    type: string
    description: Name of the ad group, offering a descriptive label for grouped ads.
  - name: date
    type: string
    description: Date of the data collection, indicating when the metrics were recorded.
  - name: impressions
    type: integer
    description: Number of times the ads were shown, reflecting reach and visibility.
  - name: clicks
    type: integer
    description: Number of times the ads were clicked, measuring user engagement.
  - name: cost
    type: float
    description: Total cost incurred for the campaign, indicating financial expenditure.
  - name: conversions
    type: integer
    description: Number of conversions, representing the count of desired actions
      completed by users.
  - name: conversion_value
    type: string
    description: Monetary value of the conversions, estimating the revenue generated
      from user actions.
  - name: currency
    type: string
    description: Currency in which the cost and conversion value are denoted, providing
      context for financial metrics.

source:
  type: landing
  path: '{landing_root}/campaigns'
  load_mode: full

dataset: bronze_google_ads_campaigns
