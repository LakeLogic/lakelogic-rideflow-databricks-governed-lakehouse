version: 1.0.0

info:
  title: Gold — Fact Campaigns Daily (Google Ads)
  target_layer: gold
  description: The table captures daily performance metrics from Google Ads campaigns,
    including impressions, clicks, conversions, and associated costs, allowing for
    detailed time-based analysis and financial evaluation of marketing activities.
    It provides key indicators of campaign effectiveness and budget utilization for
    each recorded date. The data originates from Google Ads, with each entry tied
    to a specific activity date for accurate tracking and reporting.
  table_name: '{gold_layer}_google_ads_fact_campaigns_daily'
  system: google_ads
  domain: marketing

model:
  fields:
  - name: activity_date
    type: date
    required: true
    description: The date of the recorded marketing activity, used for time-based
      analysis and reporting.
  - name: total_impressions
    type: integer
    required: false
    description: The number of times the ad was shown to users, indicating reach and
      visibility.
  - name: total_clicks
    type: integer
    required: false
    description: The number of times users clicked on the ad, measuring engagement
      and interest.
  - name: total_conversions
    type: integer
    required: false
    description: The count of desired actions completed by users after clicking the
      ad, such as purchases or sign-ups, reflecting campaign effectiveness.
  - name: total_cost
    type: float
    required: false
    description: The total monetary cost incurred for the ad campaign on this date,
      used for calculating ROI and budget management.
  - name: date_key
    type: integer
    required: false
    foreign_key:
      contract: gold_dim_date
      column: date_key
    description: The day of activity_date as YYYYMMDD — the key of the date dimension.
  - name: system
    type: string
    required: true
    description: Source system this row came from

dataset: gold_google_ads_fact_campaigns_daily

primary_key:
- activity_date

quality:
  dataset_rules:
  - unique:
      columns:
      - activity_date
      name: activity_date_unique
      category: uniqueness
      description: No two rows share the same activity_date.

transformations:
- phase: pre
  sql: |-
    WITH touched AS (
      SELECT DISTINCT
        CAST(date AS DATE) AS _touched_0
      FROM source
    ),
    r AS (
      SELECT
        CAST(date AS DATE) AS activity_date,
        SUM(impressions) AS total_impressions,
        SUM(clicks) AS total_clicks,
        SUM(conversions) AS total_conversions,
        SUM(cost) AS total_cost
      FROM silver_google_ads_campaigns_full
      JOIN touched
        ON CAST(date AS DATE) = touched._touched_0
      GROUP BY CAST(date AS DATE)
    )
    SELECT
      r.activity_date,
      r.total_impressions,
      r.total_clicks,
      r.total_conversions,
      r.total_cost,
      CAST(EXTRACT(YEAR FROM r.activity_date) AS BIGINT) * 10000 + CAST(EXTRACT(MONTH FROM r.activity_date) AS BIGINT) * 100 + CAST(EXTRACT(DAY FROM r.activity_date) AS BIGINT) AS date_key
    FROM r
- phase: pre
  derive:
    field: system
    sql: '''google_ads'''

links:
- name: silver_google_ads_campaigns_full
  type: table
  path: table:{domain_catalog}.{silver_layer}_google_ads_campaigns

upstream: []

materialization:
  fact:
    type: aggregate

source:
  type: table
  path: table:{domain_catalog}.{silver_layer}_google_ads_campaigns
  load_mode: incremental
  watermark_field: _lakelogic_processed_at

metadata:
  run_log_table: '{domain_catalog}.lakelogic_run_log'
