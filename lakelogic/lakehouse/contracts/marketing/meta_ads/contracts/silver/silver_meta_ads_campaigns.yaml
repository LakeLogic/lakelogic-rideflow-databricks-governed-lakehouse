version: 1.0.0

info:
  title: Silver — Meta Ads Campaigns
  target_layer: silver
  description: The table captures key performance metrics and identifiers for advertising
    campaigns and ad sets run through Meta Ads, including essential tracking data
    such as impressions, clicks, spend, and conversions, along with detailed user
    actions in JSON format, enabling comprehensive analysis of campaign effectiveness
    and user engagement over time.
  table_name: '{silver_layer}_meta_ads_campaigns'
  system: meta_ads
  domain: marketing

model:
  fields:
  - name: campaign_id
    type: string
    required: true
    description: Unique identifier for the advertising campaign, essential for tracking
      and reporting campaign performance.
  - name: campaign_name
    type: string
    required: false
    description: Name of the advertising campaign, used for easy identification and
      organization.
  - name: adset_id
    type: string
    required: true
    description: Unique identifier for the ad set within the campaign, helps in segmenting
      and analyzing ad performance.
  - name: adset_name
    type: string
    required: false
    description: Name of the ad set, useful for identifying specific groups of ads
      and their settings.
  - name: date
    type: date
    required: false
    description: Date of the data record, important for time-based analysis and trend
      tracking.
  - name: impressions
    type: integer
    required: false
    description: Number of times the ad was shown to users, a key metric for measuring
      reach and visibility.
  - name: clicks
    type: integer
    required: false
    description: Number of times users clicked on the ad, indicating user interest
      and engagement.
  - name: spend
    type: decimal(18,2)
    required: false
    description: Amount spent on the ad, crucial for budgeting and cost analysis.
  - name: actions_json
    type: string
    required: false
    description: JSON-formatted string containing detailed user actions, providing
      insights into user behavior and interaction.
  - name: conversions
    type: integer
    required: false
    description: Number of conversions resulting from the ad, measuring the effectiveness
      of the campaign in achieving desired outcomes.
  - name: currency
    type: string
    required: false
    description: Currency in which the spend is reported, important for financial
      reporting and analysis.

primary_key:
- campaign_id

quality:
  row_rules:
  - name: campaign_id_not_null
    sql: campaign_id IS NOT NULL
    category: completeness
    description: campaign_id is always present (never null).
  - name: adset_id_not_null
    sql: adset_id IS NOT NULL
    category: completeness
    description: adset_id is always present (never null).
  - name: campaign_id_not_null
    sql: campaign_id IS NOT NULL
    category: completeness
    description: campaign_id is always present (never null).

transformations:
- deduplicate:
    by:
    - campaign_id
    sort_by:
    - date
    order: desc

dataset: silver_meta_ads_campaigns

source:
  type: table
  path: table:{domain_catalog}.{bronze_layer}_meta_ads_campaigns
  load_mode: incremental
  watermark_field: _lakelogic_processed_at

metadata:
  run_log_table: '{domain_catalog}.lakelogic_run_log'
