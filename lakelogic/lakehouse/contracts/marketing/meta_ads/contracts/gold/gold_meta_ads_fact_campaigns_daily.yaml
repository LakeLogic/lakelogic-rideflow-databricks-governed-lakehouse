version: 1.0.0

info:
  title: Gold — Fact Campaigns Daily (Meta Ads)
  target_layer: gold
  description: The table holds daily aggregated metrics from Meta Ads campaigns, including
    impressions, clicks, and conversions, to measure the performance and effectiveness
    of marketing activities over time. It originates from the Meta Ads system and
    is designed for time-based analysis and reporting, with each record representing
    a specific activity date. The data includes a numeric date key for joining with
    date dimension tables and a system field to track data lineage.
  table_name: '{gold_layer}_meta_ads_fact_campaigns_daily'
  system: meta_ads
  domain: marketing

model:
  fields:
  - name: activity_date
    type: date
    required: true
    description: The date when the marketing activity occurred, used for time-based
      analysis and reporting.
  - name: total_impressions
    type: integer
    required: false
    description: The number of times the ad was shown to users, indicating reach and
      visibility.
  - name: total_clicks
    type: integer
    required: false
    description: The number of times users clicked on the ad, measuring engagement
      and interest.
  - name: total_conversions
    type: integer
    required: false
    description: The number of actions completed by users after interacting with the
      ad, such as purchases or sign-ups, reflecting campaign effectiveness.
  - name: date_key
    type: integer
    required: false
    foreign_key:
      contract: gold_dim_date
      column: date_key
    description: The day of activity_date as YYYYMMDD — the key of the date dimension.
  - name: system
    type: string
    required: true
    description: Source system this row came from

dataset: gold_meta_ads_fact_campaigns_daily

primary_key:
- activity_date

quality:
  dataset_rules:
  - unique:
      columns:
      - activity_date
      name: activity_date_unique
      category: uniqueness
      description: No two rows share the same activity_date.

transformations:
- phase: pre
  sql: |-
    WITH touched AS (
      SELECT DISTINCT
        CAST(date AS DATE) AS _touched_0
      FROM source
    ),
    r AS (
      SELECT
        CAST(date AS DATE) AS activity_date,
        SUM(impressions) AS total_impressions,
        SUM(clicks) AS total_clicks,
        SUM(conversions) AS total_conversions
      FROM silver_meta_ads_campaigns_full
      JOIN touched
        ON CAST(date AS DATE) = touched._touched_0
      GROUP BY CAST(date AS DATE)
    )
    SELECT
      r.activity_date,
      r.total_impressions,
      r.total_clicks,
      r.total_conversions,
      CAST(EXTRACT(YEAR FROM r.activity_date) AS BIGINT) * 10000 + CAST(EXTRACT(MONTH FROM r.activity_date) AS BIGINT) * 100 + CAST(EXTRACT(DAY FROM r.activity_date) AS BIGINT) AS date_key
    FROM r
- phase: pre
  derive:
    field: system
    sql: '''meta_ads'''

links:
- name: silver_meta_ads_campaigns_full
  type: table
  path: table:{domain_catalog}.{silver_layer}_meta_ads_campaigns

upstream: []

materialization:
  fact:
    type: aggregate

source:
  type: table
  path: table:{domain_catalog}.{silver_layer}_meta_ads_campaigns
  load_mode: incremental
  watermark_field: _lakelogic_processed_at

metadata:
  run_log_table: '{domain_catalog}.lakelogic_run_log'
