version: 1.0.0

info:
  title: Bronze — Meta Ads Campaigns
  description: The table captures detailed performance metrics for individual advertising
    campaigns and ad sets from Meta Ads, including essential identifiers, engagement
    statistics like impressions, clicks, and conversions, along with financial data
    such as spend and currency, enabling comprehensive tracking and analysis of campaign
    effectiveness over time. Updated after delivery.
  target_layer: bronze
  domain: marketing
  system: meta_ads
  table_name: '{bronze_layer}_meta_ads_campaigns'

model:
  fields:
  - name: campaign_id
    type: string
    description: Unique identifier for the advertising campaign, essential for tracking
      and reporting campaign performance.
  - name: campaign_name
    type: string
    description: Name of the advertising campaign, used for easy identification and
      organization.
  - name: adset_id
    type: string
    description: Unique identifier for the ad set within the campaign, helps in segmenting
      and analyzing ad performance.
  - name: adset_name
    type: string
    description: Name of the ad set, useful for identifying specific groups of ads
      and their settings.
  - name: date
    type: string
    description: Date of the data record, important for time-based analysis and trend
      tracking.
  - name: impressions
    type: integer
    description: Number of times the ad was shown to users, a key metric for measuring
      reach and visibility.
  - name: clicks
    type: integer
    description: Number of times users clicked on the ad, indicating user interest
      and engagement.
  - name: spend
    type: string
    description: Amount spent on the ad, crucial for budgeting and cost analysis.
  - name: actions_json
    type: string
    description: JSON-formatted string containing detailed user actions, providing
      insights into user behavior and interaction.
  - name: conversions
    type: integer
    description: Number of conversions resulting from the ad, measuring the effectiveness
      of the campaign in achieving desired outcomes.
  - name: currency
    type: string
    description: Currency in which the spend is reported, important for financial
      reporting and analysis.

source:
  type: landing
  path: '{landing_root}/campaigns'
  load_mode: full

dataset: bronze_meta_ads_campaigns
