version: 1.0.0

info:
  title: Gold — Fact App Events Daily
  target_layer: gold
  description: 'grain: one row per day'
  table_name: '{gold_layer}_fact_app_events_daily'
  system: google_analytics
  domain: marketing

model:
  fields:
  - name: activity_date
    type: date
    required: true
  - name: event_count
    type: integer
    required: false
  - name: date_key
    type: integer
    required: false
    foreign_key:
      contract: gold_dim_date
      column: date_key
    description: The day of activity_date as YYYYMMDD — the key of the date dimension.
  - name: system
    type: string
    required: true
    description: Source system this row came from

dataset: gold_fact_app_events_daily

primary_key:
- activity_date

quality:
  dataset_rules:
  - unique:
      columns:
      - activity_date
      name: activity_date_unique
      category: uniqueness
      description: No two rows share the same activity_date.

transformations:
- phase: pre
  sql: |-
    WITH touched AS (
      SELECT DISTINCT
        CAST(event_timestamp AS DATE) AS _touched_0
      FROM source
    ),
    r AS (
      SELECT
        CAST(event_timestamp AS DATE) AS activity_date,
        COUNT(event_name) AS event_count
      FROM silver_google_analytics_app_events_full
      JOIN touched
        ON CAST(event_timestamp AS DATE) = touched._touched_0
      GROUP BY CAST(event_timestamp AS DATE)
    )
    SELECT
      r.activity_date,
      r.event_count,
      CAST(EXTRACT(YEAR FROM r.activity_date) AS BIGINT) * 10000 + CAST(EXTRACT(MONTH FROM r.activity_date) AS BIGINT) * 100 + CAST(EXTRACT(DAY FROM r.activity_date) AS BIGINT) AS date_key
    FROM r
- phase: pre
  derive:
    field: system
    sql: '''google_analytics'''

links:
- name: silver_google_analytics_app_events_full
  type: table
  path: table:{domain_catalog}.{silver_layer}_google_analytics_app_events

upstream: []

materialization:
  fact:
    type: aggregate

source:
  type: table
  path: table:{domain_catalog}.{silver_layer}_google_analytics_app_events
  load_mode: incremental
  watermark_field: _lakelogic_processed_at

metadata:
  run_log_table: '{domain_catalog}.lakelogic_run_log'
