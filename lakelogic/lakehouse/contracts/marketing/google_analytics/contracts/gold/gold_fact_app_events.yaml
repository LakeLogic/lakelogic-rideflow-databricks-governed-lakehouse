version: 1.0.0

info:
  title: Gold — Fact App Events
  target_layer: gold
  description: 'grain: one row per app event'
  table_name: '{gold_layer}_fact_app_events'
  system: google_analytics
  domain: marketing

model:
  fields:
  - name: user_pseudo_id
    type: string
    required: true
    description: A pseudo ID that uniquely identifies a user session, enabling analysis
      without exposing personal identifiers.
  - name: user_id
    type: string
    required: true
    description: An identifier for a registered user, allowing tracking of user-specific
      behavior and preferences.
  - name: device_id
    type: string
    required: true
    pii: true
    masking: hash
    classification: device_id
    description: 'The unique identifier for the device used to access the app, important
      for device-specific analytics (note: contains personal data).'
  - name: event_timestamp
    type: timestamp
    required: true
    description: The precise time when the event was recorded, allowing for accurate
      timing and sequence analysis.
  - name: event_count
    type: integer
    required: false
  - name: event_name
    type: string
    required: false
    description: The name of the event that occurred within the app, helping to track
      user actions and interactions.
  - name: device_category
    type: string
    required: false
    description: The category of the device (e.g., mobile, tablet, desktop) used to
      access the app, aiding in device-specific insights.
  - name: device_os
    type: string
    required: false
    description: The operating system of the device used to access the app, helping
      to understand platform-specific usage patterns.
  - name: geo_country
    type: string
    required: false
    description: The country where the event originated, providing geographic context
      for user behavior and performance.
  - name: geo_city
    type: string
    required: false
    description: The city where the event originated, offering more granular geographic
      insights for localized analysis.
  - name: app_version
    type: string
    required: false
    description: The version of the app from which the event was recorded, important
      for tracking feature usage across different releases.
  - name: date_key
    type: integer
    required: false
    foreign_key:
      contract: gold_dim_date
      column: date_key
    description: The day of activity_date as YYYYMMDD — the key of the date dimension.
  - name: event_date
    type: date
    required: false
    description: 'Partition column: the calendar date of `event_timestamp`.'
  - name: system
    type: string
    required: true
    description: Source system this row came from

dataset: gold_fact_app_events

primary_key:
- user_pseudo_id
- user_id
- device_id
- event_timestamp

quality:
  dataset_rules:
  - unique:
      columns:
      - user_pseudo_id
      - user_id
      - device_id
      - event_timestamp
      name: user_pseudo_id_user_id_device_id_event_timestamp_unique
      category: uniqueness
      description: No two rows share the same user_pseudo_id, user_id, device_id,
        event_timestamp.

transformations:
- phase: pre
  sql: |-
    SELECT
      r.user_pseudo_id,
      r.user_id,
      r.device_id,
      r.event_timestamp,
      r.event_name,
      r.device_category,
      r.device_os,
      r.geo_country,
      r.geo_city,
      r.app_version,
      CAST(EXTRACT(YEAR FROM CAST(r.event_timestamp AS DATE)) AS BIGINT) * 10000 + CAST(EXTRACT(MONTH FROM CAST(r.event_timestamp AS DATE)) AS BIGINT) * 100 + CAST(EXTRACT(DAY FROM CAST(r.event_timestamp AS DATE)) AS BIGINT) AS date_key,
      CASE WHEN r.event_name IS NOT NULL THEN 1 ELSE 0 END AS event_count,
      CAST(r.event_timestamp AS DATE) AS event_date
    FROM source r
- phase: pre
  derive:
    field: system
    sql: '''google_analytics'''

materialization:
  strategy: append
  fact:
    type: transaction
  partition_by:
  - geo_country
  - event_date

source:
  type: table
  path: table:{domain_catalog}.{silver_layer}_google_analytics_app_events
  load_mode: incremental
  watermark_field: _lakelogic_processed_at

metadata:
  run_log_table: '{domain_catalog}.lakelogic_run_log'
