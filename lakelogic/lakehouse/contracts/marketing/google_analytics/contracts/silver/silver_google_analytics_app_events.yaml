version: 1.0.0

info:
  title: Silver — Google Analytics App Events
  target_layer: silver
  description: The table captures user interactions and actions within an app as recorded
    by Google Analytics, including event details, timestamps, and user and device
    identifiers, with fields that may contain personal data such as device IDs and
    IP addresses, enabling analysis of user behavior, device usage, and geographic
    trends.
  table_name: '{silver_layer}_google_analytics_app_events'
  system: google_analytics
  domain: marketing

model:
  fields:
  - name: event_name
    type: string
    required: false
    description: The name of the event that occurred within the app, helping to track
      user actions and interactions.
  - name: event_timestamp
    type: timestamp
    required: true
    description: The precise time when the event was recorded, allowing for accurate
      timing and sequence analysis.
  - name: event_date
    type: date
    required: false
    description: The date on which the event occurred, useful for trend analysis and
      reporting over time.
  - name: user_pseudo_id
    type: string
    required: true
    description: A pseudo ID that uniquely identifies a user session, enabling analysis
      without exposing personal identifiers.
  - name: user_id
    type: string
    required: true
    description: An identifier for a registered user, allowing tracking of user-specific
      behavior and preferences.
  - name: device_id
    type: string
    required: true
    pii: true
    classification: device_id
    description: 'The unique identifier for the device used to access the app, important
      for device-specific analytics (note: contains personal data).'
  - name: ip_address
    type: string
    required: false
    pii: true
    classification: ip_address
    description: 'The IP address from which the event was reported, useful for geographic
      and network analysis (note: contains personal data).'
  - name: device_category
    type: string
    required: false
    description: The category of the device (e.g., mobile, tablet, desktop) used to
      access the app, aiding in device-specific insights.
  - name: device_os
    type: string
    required: false
    description: The operating system of the device used to access the app, helping
      to understand platform-specific usage patterns.
  - name: geo_country
    type: string
    required: false
    description: The country where the event originated, providing geographic context
      for user behavior and performance.
  - name: geo_city
    type: string
    required: false
    description: The city where the event originated, offering more granular geographic
      insights for localized analysis.
  - name: app_version
    type: string
    required: false
    description: The version of the app from which the event was recorded, important
      for tracking feature usage across different releases.
  - name: event_params_json
    type: string
    required: false
    description: A JSON string containing additional parameters related to the event,
      providing detailed context and metadata for deeper analysis.

materialization:
  strategy: overwrite
  partition_by:
  - geo_country
  - event_date

quality:
  row_rules:
  - name: event_timestamp_not_null
    sql: event_timestamp IS NOT NULL
    category: completeness
    description: event_timestamp is always present (never null).
  - name: user_pseudo_id_not_null
    sql: user_pseudo_id IS NOT NULL
    category: completeness
    description: user_pseudo_id is always present (never null).
  - name: user_id_not_null
    sql: user_id IS NOT NULL
    category: completeness
    description: user_id is always present (never null).
  - name: device_id_not_null
    sql: device_id IS NOT NULL
    category: completeness
    description: device_id is always present (never null).

dataset: silver_google_analytics_app_events

source:
  type: table
  path: table:{domain_catalog}.{bronze_layer}_google_analytics_app_events
  load_mode: incremental
  watermark_field: _lakelogic_processed_at

metadata:
  run_log_table: '{domain_catalog}.lakelogic_run_log'
