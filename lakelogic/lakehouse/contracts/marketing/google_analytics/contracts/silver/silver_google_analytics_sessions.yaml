version: 1.0.0

info:
  title: Silver — Google Analytics Sessions
  target_layer: silver
  description: The table holds detailed metrics and attributes for each user session
    collected from Google Analytics, enabling analysis of user behavior, engagement,
    and traffic sources. It includes pseudonymous and permanent user identifiers,
    session timestamps, interaction counts, traffic details, device categories, and
    geographic locations. Notably, it contains personal data such as IP addresses,
    which provide geographic and network context for users.
  table_name: '{silver_layer}_google_analytics_sessions'
  system: google_analytics
  domain: marketing

model:
  fields:
  - name: session_id
    type: string
    required: true
    description: Unique identifier for a user session, allowing analysis of individual
      user interactions.
  - name: user_pseudo_id
    type: string
    required: true
    description: Pseudonymous identifier for a user, used when a persistent user ID
      isn't available.
  - name: user_id
    type: string
    required: true
    description: Permanent identifier for a user, if available, enabling long-term
      tracking across sessions.
  - name: ip_address
    type: string
    required: false
    pii: true
    classification: ip_address
    description: 'IP address of the user, providing geographic and network context
      (note: this is personal data).'
  - name: session_start
    type: string
    required: false
    description: Timestamp indicating when the session began, crucial for time-based
      analysis.
  - name: session_duration_seconds
    type: integer
    required: false
    description: Length of the session in seconds, measuring user engagement.
  - name: page_views
    type: integer
    required: false
    description: Count of pages viewed during the session, indicating depth of interaction.
  - name: traffic_source
    type: string
    required: false
    description: Origin of the traffic (e.g., search engine, social media), helping
      to evaluate channel effectiveness.
  - name: traffic_medium
    type: string
    required: false
    description: Type of traffic medium (e.g., organic, referral), detailing how users
      arrived at the site.
  - name: traffic_campaign
    type: string
    required: false
    description: Specific marketing campaign associated with the traffic, supporting
      campaign performance analysis.
  - name: device_category
    type: string
    required: false
    description: Category of device used (e.g., mobile, desktop, tablet), informing
      UX and targeting strategies.
  - name: geo_country
    type: string
    required: false
    description: Country where the user is located, enabling geographic-based analysis
      and targeting.
  - name: landing_page
    type: string
    required: false
    description: First page visited in the session, useful for assessing entry points
      and optimizing landing pages.

primary_key:
- session_id

quality:
  row_rules:
  - name: session_id_not_null
    sql: session_id IS NOT NULL
    category: completeness
    description: session_id is always present (never null).
  - name: user_pseudo_id_not_null
    sql: user_pseudo_id IS NOT NULL
    category: completeness
    description: user_pseudo_id is always present (never null).
  - name: user_id_not_null
    sql: user_id IS NOT NULL
    category: completeness
    description: user_id is always present (never null).
  - name: session_id_not_null
    sql: session_id IS NOT NULL
    category: completeness
    description: session_id is always present (never null).

transformations:
- deduplicate:
    by:
    - session_id
    sort_by:
    - _lakelogic_processed_at
    order: desc

materialization:
  partition_by:
  - geo_country

dataset: silver_google_analytics_sessions

source:
  type: table
  path: table:{domain_catalog}.{bronze_layer}_google_analytics_sessions
  load_mode: incremental
  watermark_field: _lakelogic_processed_at

metadata:
  run_log_table: '{domain_catalog}.lakelogic_run_log'
