version: 1.0.0

info:
  title: Gold — Fact Trips Daily
  target_layer: gold
  description: The table aggregates daily ride metrics from the rideflow system, capturing
    key performance indicators such as total fares, tips, distances traveled, average
    ride durations, surge multipliers, and rider and driver ratings. It provides a
    comprehensive overview of ride activities for each day, enabling time-based analysis
    and reporting. The data includes both financial metrics and operational insights,
    supporting revenue tracking, service efficiency evaluation, and customer satisfaction
    assessment.
  table_name: '{gold_layer}_fact_trips_daily'
  system: rideflow
  domain: marketplace

model:
  fields:
  - name: activity_date
    type: date
    required: true
    description: The date on which the ride activities occurred, used for time-based
      analysis and reporting.
  - name: total_fare_amount
    type: float
    required: false
    description: The aggregated fare amount collected from all rides on the activity
      date, indicating revenue generated.
  - name: total_tip_amount
    type: float
    required: false
    description: The aggregated tip amounts from all rides on the activity date, reflecting
      customer satisfaction and additional revenue.
  - name: total_distance_km
    type: float
    required: false
    description: The total distance covered by all rides on the activity date, useful
      for analyzing service coverage and driver efficiency.
  - name: avg_duration_minutes
    type: float
    required: false
    description: The average duration of rides on the activity date, providing insights
      into ride efficiency and traffic conditions.
  - name: avg_surge_multiplier
    type: float
    required: false
    description: The average surge pricing multiplier applied during rides on the
      activity date, indicating demand fluctuations.
  - name: avg_rider_rating
    type: float
    required: false
    description: The average rating given by riders to drivers on the activity date,
      reflecting service quality and customer satisfaction.
  - name: avg_driver_rating
    type: float
    required: false
    description: The average rating given by drivers to riders on the activity date,
      indicating rider behavior and satisfaction.
  - name: date_key
    type: integer
    required: false
    foreign_key:
      contract: gold_dim_date
      column: date_key
    description: The day of activity_date as YYYYMMDD — the key of the date dimension.
  - name: system
    type: string
    required: true
    description: Source system this row came from

dataset: gold_fact_trips_daily

primary_key:
- activity_date

quality:
  dataset_rules:
  - unique:
      columns:
      - activity_date
      name: activity_date_unique
      category: uniqueness
      description: No two rows share the same activity_date.

transformations:
- phase: pre
  sql: |-
    WITH touched AS (
      SELECT DISTINCT
        CAST(requested_at AS DATE) AS _touched_0
      FROM source
    ),
    r AS (
      SELECT
        CAST(requested_at AS DATE) AS activity_date,
        SUM(fare_amount) AS total_fare_amount,
        SUM(tip_amount) AS total_tip_amount,
        SUM(distance_km) AS total_distance_km,
        AVG(duration_minutes) AS avg_duration_minutes,
        AVG(surge_multiplier) AS avg_surge_multiplier,
        AVG(rider_rating) AS avg_rider_rating,
        AVG(driver_rating) AS avg_driver_rating
      FROM silver_rideflow_trips_full
      JOIN touched
        ON CAST(requested_at AS DATE) = touched._touched_0
      GROUP BY CAST(requested_at AS DATE)
    )
    SELECT
      r.activity_date,
      r.total_fare_amount,
      r.total_tip_amount,
      r.total_distance_km,
      r.avg_duration_minutes,
      r.avg_surge_multiplier,
      r.avg_rider_rating,
      r.avg_driver_rating,
      CAST(EXTRACT(YEAR FROM r.activity_date) AS BIGINT) * 10000 + CAST(EXTRACT(MONTH FROM r.activity_date) AS BIGINT) * 100 + CAST(EXTRACT(DAY FROM r.activity_date) AS BIGINT) AS date_key
    FROM r
- phase: pre
  derive:
    field: system
    sql: '''rideflow'''

links:
- name: silver_rideflow_trips_full
  type: table
  path: table:{domain_catalog}.{silver_layer}_rideflow_trips

upstream: []

materialization:
  fact:
    type: aggregate

source:
  type: table
  path: table:{domain_catalog}.{silver_layer}_rideflow_trips
  load_mode: incremental
  watermark_field: _lakelogic_processed_at

metadata:
  run_log_table: '{domain_catalog}.lakelogic_run_log'
