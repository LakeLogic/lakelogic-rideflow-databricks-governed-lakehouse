version: 1.0.0

info:
  title: Gold — Fact Rider App Events
  target_layer: gold
  description: The table holds detailed records of user interactions within the rideflow
    app, capturing each event instance with contextual information such as the screen,
    app version, and platform to support analytical and diagnostic purposes. It links
    each event to rider profiles and normalized dimensions for event names and platforms,
    enabling consistent reporting and aggregated analysis. The data originates from
    the rideflow system, with timestamps and city codes providing additional context
    for time-based and localized analysis.
  table_name: '{gold_layer}_fact_rider_app_events'
  system: rideflow
  domain: marketplace

model:
  fields:
  - name: event_id
    type: string
    required: true
    description: Unique identifier for each event, ensuring each event instance is
      trackable and analyzable.
  - name: event_name
    type: string
    required: false
    description: Name of the event occurring within the app, categorizing user actions
      for analytical and diagnostic purposes.
  - name: screen_name
    type: string
    required: false
    description: Name of the app screen where the event occurred, providing context
      to user interactions and navigation flow.
  - name: app_version
    type: string
    required: false
    description: Version of the app in use when the event was triggered, important
      for identifying issues or features specific to certain app releases.
  - name: platform
    type: string
    required: false
    description: Platform on which the app is running (e.g., iOS, Android), aiding
      in platform-specific analysis and optimization.
  - name: city_code
    type: string
    required: false
    description: Code representing the city where the event took place, useful for
      localized analysis and regional service adjustments.
  - name: event_timestamp
    type: timestamp
    required: false
    description: Timestamp indicating when the event occurred, essential for time-based
      analysis and sequencing of user activities.
  - name: rider_sk
    type: string
    required: true
    foreign_key:
      contract: gold_dim_rider_profiles
      column: rider_profiles_sk
    description: Surrogate key of gold_dim_rider_profiles, looked up on its business
      key; '-1' when the dimension does not know the row.
  - name: event_name_sk
    type: string
    required: true
    foreign_key:
      contract: gold_rideflow_dim_event_name
      column: event_name_sk
    description: Surrogate key of gold_rideflow_dim_event_name, looked up on its business
      key; '-1' when the dimension does not know the row.
  - name: platform_sk
    type: string
    required: true
    foreign_key:
      contract: gold_rideflow_dim_platform
      column: platform_sk
    description: Surrogate key of gold_rideflow_dim_platform, looked up on its business
      key; '-1' when the dimension does not know the row.
  - name: event_date
    type: date
    required: false
    description: 'Partition column: the calendar date of `event_timestamp`.'
  - name: system
    type: string
    required: true
    description: Source system this row came from

dataset: gold_fact_rider_app_events

primary_key:
- event_id

quality:
  dataset_rules:
  - unique:
      columns:
      - event_id
      name: event_id_unique
      category: uniqueness
      description: No two rows share the same event_id.
  - name: rider_sk_unknown_member_rows
    sql: SELECT COUNT(*) FROM {dataset} WHERE rider_sk = '-1'
    must_be_less_than: 1
    severity: warning
    category: consistency
    description: Rows whose rider_sk fell back to the unknown member — the dimension
      did not know them when this fact ran.
  - name: event_name_sk_unknown_member_rows
    sql: SELECT COUNT(*) FROM {dataset} WHERE event_name_sk = '-1'
    must_be_less_than: 1
    severity: warning
    category: consistency
    description: Rows whose event_name_sk fell back to the unknown member — the dimension
      did not know them when this fact ran.
  - name: platform_sk_unknown_member_rows
    sql: SELECT COUNT(*) FROM {dataset} WHERE platform_sk = '-1'
    must_be_less_than: 1
    severity: warning
    category: consistency
    description: Rows whose platform_sk fell back to the unknown member — the dimension
      did not know them when this fact ran.

transformations:
- phase: pre
  sql: |-
    SELECT
      r.event_id,
      r.event_name,
      r.screen_name,
      r.app_version,
      r.platform,
      r.city_code,
      r.event_timestamp,
      COALESCE(d1.rider_profiles_sk, '-1') AS rider_sk,
      COALESCE(d2.event_name_sk, '-1') AS event_name_sk,
      COALESCE(d3.platform_sk, '-1') AS platform_sk,
      CAST(r.event_timestamp AS DATE) AS event_date
    FROM source r
    LEFT JOIN gold_dim_rider_profiles d1
      ON  r.rider_id = d1.rider_id
    LEFT JOIN gold_rideflow_dim_event_name d2
      ON  r.event_name = d2.event_name
    LEFT JOIN gold_rideflow_dim_platform d3
      ON  r.platform = d3.platform
- phase: pre
  derive:
    field: system
    sql: '''rideflow'''

links:
- name: gold_dim_rider_profiles
  type: table
  path: table:{domain_catalog}.{gold_layer}_dim_rider_profiles
- name: gold_rideflow_dim_event_name
  type: table
  path: table:{domain_catalog}.{gold_layer}_rideflow_dim_event_name
- name: gold_rideflow_dim_platform
  type: table
  path: table:{domain_catalog}.{gold_layer}_rideflow_dim_platform

upstream:
- gold_dim_rider_profiles
- gold_rideflow_dim_event_name
- gold_rideflow_dim_platform

materialization:
  strategy: append
  fact:
    type: factless
  partition_by:
  - event_date

source:
  type: table
  path: table:{domain_catalog}.{silver_layer}_rideflow_rider_app_events
  load_mode: incremental
  watermark_field: _lakelogic_processed_at

metadata:
  run_log_table: '{domain_catalog}.lakelogic_run_log'
