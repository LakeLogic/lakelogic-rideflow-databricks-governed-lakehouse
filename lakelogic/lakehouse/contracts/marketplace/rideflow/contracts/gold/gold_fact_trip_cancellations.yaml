version: 1.0.0

info:
  title: Gold — Fact Trip Cancellations
  target_layer: gold
  description: The table records each instance when a trip was cancelled in the marketplace,
    capturing details such as the cancellation fee, the identities of the rider and
    driver involved, the timestamps of when the cancellation was requested and finalized,
    and surrogate keys linking to enriched profiles and standard cancellation reasons.
    It originates from the rideflow system and is enriched with reference data from
    dimension tables for drivers, riders, cancellation reasons, and the entity that
    initiated the cancellation.
  table_name: '{gold_layer}_fact_trip_cancellations'
  system: rideflow
  domain: marketplace

model:
  fields:
  - name: cancellation_id
    type: string
    required: true
    description: Unique identifier for the cancellation event, used to track and reference
      each cancellation record.
  - name: cancellation_fee_amount
    type: float
    required: false
    description: Monetary amount charged as a fee for the cancellation, impacting
      revenue and rider/driver relations.
  - name: trip_id
    type: string
    required: false
    description: Identifier for the trip that was cancelled, linking the cancellation
      to the original trip details.
  - name: rider_id
    type: string
    required: false
    description: Identifier for the rider who requested or experienced the cancellation,
      used to analyze rider behavior and satisfaction.
  - name: driver_id
    type: string
    required: false
    description: Identifier for the driver involved in the cancelled trip, used to
      assess driver performance and issues.
  - name: cancelled_at
    type: timestamp
    required: false
    description: Timestamp indicating when the cancellation was finalized, used to
      measure cancellation processing times.
  - name: requested_at
    type: timestamp
    required: false
    description: Timestamp indicating when the cancellation was requested, used to
      track the timing and pattern of cancellations.
  - name: driver_sk
    type: string
    required: true
    foreign_key:
      contract: gold_dim_driver_profiles
      column: driver_profiles_sk
    description: Surrogate key of gold_dim_driver_profiles, looked up on its business
      key; '-1' when the dimension does not know the row.
  - name: rider_sk
    type: string
    required: true
    foreign_key:
      contract: gold_dim_rider_profiles
      column: rider_profiles_sk
    description: Surrogate key of gold_dim_rider_profiles, looked up on its business
      key; '-1' when the dimension does not know the row.
  - name: cancel_reason_code_sk
    type: string
    required: true
    foreign_key:
      contract: gold_dim_cancel_reason_code
      column: cancel_reason_code_sk
    description: Surrogate key of gold_dim_cancel_reason_code, looked up on its business
      key; '-1' when the dimension does not know the row.
  - name: cancelled_by_sk
    type: string
    required: true
    foreign_key:
      contract: gold_dim_cancelled_by
      column: cancelled_by_sk
    description: Surrogate key of gold_dim_cancelled_by, looked up on its business
      key; '-1' when the dimension does not know the row.
  - name: cancelled_date
    type: date
    required: false
    description: 'Partition column: the calendar date of `cancelled_at`.'
  - name: system
    type: string
    required: true
    description: Source system this row came from

dataset: gold_fact_trip_cancellations

primary_key:
- cancellation_id

quality:
  dataset_rules:
  - unique:
      columns:
      - cancellation_id
      name: cancellation_id_unique
      category: uniqueness
      description: No two rows share the same cancellation_id.
  - name: driver_sk_unknown_member_rows
    sql: SELECT COUNT(*) FROM {dataset} WHERE driver_sk = '-1'
    must_be_less_than: 1
    severity: warning
    category: consistency
    description: Rows whose driver_sk fell back to the unknown member — the dimension
      did not know them when this fact ran.
  - name: rider_sk_unknown_member_rows
    sql: SELECT COUNT(*) FROM {dataset} WHERE rider_sk = '-1'
    must_be_less_than: 1
    severity: warning
    category: consistency
    description: Rows whose rider_sk fell back to the unknown member — the dimension
      did not know them when this fact ran.
  - name: cancel_reason_code_sk_unknown_member_rows
    sql: SELECT COUNT(*) FROM {dataset} WHERE cancel_reason_code_sk = '-1'
    must_be_less_than: 1
    severity: warning
    category: consistency
    description: Rows whose cancel_reason_code_sk fell back to the unknown member
      — the dimension did not know them when this fact ran.
  - name: cancelled_by_sk_unknown_member_rows
    sql: SELECT COUNT(*) FROM {dataset} WHERE cancelled_by_sk = '-1'
    must_be_less_than: 1
    severity: warning
    category: consistency
    description: Rows whose cancelled_by_sk fell back to the unknown member — the
      dimension did not know them when this fact ran.

transformations:
- phase: pre
  sql: |-
    SELECT
      r.cancellation_id,
      r.trip_id,
      r.rider_id,
      r.driver_id,
      r.cancelled_at,
      r.requested_at,
      r.cancellation_fee AS cancellation_fee_amount,
      COALESCE(d1.driver_profiles_sk, '-1') AS driver_sk,
      COALESCE(d2.rider_profiles_sk, '-1') AS rider_sk,
      COALESCE(d3.cancel_reason_code_sk, '-1') AS cancel_reason_code_sk,
      COALESCE(d4.cancelled_by_sk, '-1') AS cancelled_by_sk,
      CAST(r.cancelled_at AS DATE) AS cancelled_date
    FROM source r
    LEFT JOIN gold_dim_driver_profiles d1
      ON  r.driver_id = d1.driver_id
    LEFT JOIN gold_dim_rider_profiles d2
      ON  r.rider_id = d2.rider_id
    LEFT JOIN gold_dim_cancel_reason_code d3
      ON  r.cancel_reason_code = d3.cancel_reason_code
    LEFT JOIN gold_dim_cancelled_by d4
      ON  r.cancelled_by = d4.cancelled_by
- phase: pre
  derive:
    field: system
    sql: '''rideflow'''

links:
- name: gold_dim_driver_profiles
  type: table
  path: table:{domain_catalog}.{gold_layer}_dim_driver_profiles
- name: gold_dim_rider_profiles
  type: table
  path: table:{domain_catalog}.{gold_layer}_dim_rider_profiles
- name: gold_dim_cancel_reason_code
  type: table
  path: table:{domain_catalog}.{gold_layer}_dim_cancel_reason_code
- name: gold_dim_cancelled_by
  type: table
  path: table:{domain_catalog}.{gold_layer}_dim_cancelled_by

upstream:
- gold_dim_cancel_reason_code
- gold_dim_cancelled_by
- gold_dim_driver_profiles
- gold_dim_rider_profiles

materialization:
  strategy: append
  fact:
    type: transaction
  partition_by:
  - cancelled_date

source:
  type: table
  path: table:{domain_catalog}.{silver_layer}_rideflow_trip_cancellations
  load_mode: incremental
  watermark_field: _lakelogic_processed_at

metadata:
  run_log_table: '{domain_catalog}.lakelogic_run_log'
