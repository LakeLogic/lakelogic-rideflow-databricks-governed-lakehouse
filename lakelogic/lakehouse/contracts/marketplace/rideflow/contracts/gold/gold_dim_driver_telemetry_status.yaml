version: 1.0.0

info:
  title: Gold — Dim Driver Telemetry Status
  target_layer: gold
  description: The table holds the current operational statuses of drivers within
    the ride marketplace, detailing whether each driver is available or active for
    ride requests. It includes a unique identifier for each status record to ensure
    data integrity and enable efficient lookups, along with the originating system
    that captured the status data to support lineage tracing. The data originates
    from various platforms where driver statuses are monitored and reported.
  table_name: '{gold_layer}_dim_driver_telemetry_status'
  system: rideflow
  domain: marketplace

model:
  fields:
  - name: status_sk
    type: string
    required: false
    description: 'Surrogate key: sha256 of the business key, written by the materializer;
      ''-1'' is the unknown member.'
  - name: status
    type: string
    required: true
    description: Current operational status of the driver, indicating their availability
      or activity level for ride requests.
  - name: system
    type: string
    required: true
    description: Source system this row came from

dataset: gold_dim_driver_telemetry_status

primary_key:
- status

quality:
  dataset_rules:
  - unique:
      columns:
      - status
      name: status_unique
      category: uniqueness
      description: No two rows share the same status.

materialization:
  scd1:
    surrogate_key: status_sk
    surrogate_key_strategy: hash
    unknown_member:
      enabled: true
      surrogate_key_value: '-1'

transformations:
- phase: pre
  sql: |-
    SELECT DISTINCT status
    FROM source
    WHERE status IS NOT NULL
- phase: pre
  derive:
    field: system
    sql: '''rideflow'''

source:
  type: table
  path: table:{domain_catalog}.{silver_layer}_rideflow_driver_telemetry
  load_mode: incremental
  watermark_field: _lakelogic_processed_at

metadata:
  run_log_table: '{domain_catalog}.lakelogic_run_log'
