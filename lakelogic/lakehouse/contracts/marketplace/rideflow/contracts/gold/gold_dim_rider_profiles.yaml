version: 1.0.0

info:
  title: Gold — Dim Rider Profiles
  target_layer: gold
  description: 'grain: one row per rider'
  table_name: '{gold_layer}_dim_rider_profiles'
  system: rideflow
  domain: marketplace

model:
  fields:
  - name: rider_profiles_sk
    type: string
    required: false
    description: 'Surrogate key: sha256 of the business key, written by the materializer;
      ''-1'' is the unknown member.'
  - name: rider_id
    type: string
    required: true
    description: Unique identifier for the rider, essential for linking rider data
      across systems and processes.
  - name: city_code
    type: string
    required: false
    description: Code representing the city where the rider is located, aiding in
      regional analysis and services.
  - name: country_code
    type: string
    required: false
    description: Code representing the country of the rider, important for compliance
      and regional segmentation.
  - name: preferred_payment_method
    type: string
    required: false
    description: Rider's preferred method of payment, streamlining the checkout process.
  - name: signup_date
    type: date
    required: false
    description: Date when the rider registered, indicating the duration of their
      association with the platform.
  - name: status
    type: string
    required: false
    description: Current status of the rider's account, indicating activity level
      or special conditions.
  - name: updated_at
    type: timestamp
    required: false
    description: Timestamp of the last update to the rider's profile, ensuring data
      freshness and accuracy.
  - name: system
    type: string
    required: true
    description: Source system this row came from

dataset: gold_dim_rider_profiles

primary_key:
- rider_id

materialization:
  scd1:
    surrogate_key: rider_profiles_sk
    surrogate_key_strategy: hash
    unknown_member:
      enabled: true
      surrogate_key_value: '-1'

source:
  type: table
  path: table:{domain_catalog}.{silver_layer}_rideflow_rider_profiles
  load_mode: incremental
  watermark_field: _lakelogic_processed_at

metadata:
  run_log_table: '{domain_catalog}.lakelogic_run_log'

transformations:
- phase: pre
  derive:
    field: system
    sql: '''rideflow'''
