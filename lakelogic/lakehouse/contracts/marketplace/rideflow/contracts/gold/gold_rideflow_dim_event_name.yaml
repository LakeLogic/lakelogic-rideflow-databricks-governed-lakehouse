version: 1.0.0

info:
  title: Gold — Dim Event Name
  target_layer: gold
  description: The table contains a unique surrogate key and the human-readable name
    for various marketplace events, allowing consistent identification and handling
    of unknown entries across different systems. It also records the source system
    for each event, providing context and traceability for the data lineage.
  table_name: '{gold_layer}_rideflow_dim_event_name'
  system: rideflow
  domain: marketplace

model:
  fields:
  - name: event_name_sk
    type: string
    required: false
    description: 'Surrogate key: sha256 of the business key, written by the materializer;
      ''-1'' is the unknown member.'
  - name: event_name
    type: string
    required: true
    description: The name of the event, providing a human-readable identifier for
      the specific occurrence or activity captured in the data.
  - name: system
    type: string
    required: true
    description: Source system this row came from

dataset: gold_rideflow_dim_event_name

primary_key:
- event_name

quality:
  dataset_rules:
  - unique:
      columns:
      - event_name
      name: event_name_unique
      category: uniqueness
      description: No two rows share the same event_name.

materialization:
  scd1:
    surrogate_key: event_name_sk
    surrogate_key_strategy: hash
    unknown_member:
      enabled: true
      surrogate_key_value: '-1'

transformations:
- phase: pre
  sql: |-
    SELECT DISTINCT event_name
    FROM source
    WHERE event_name IS NOT NULL
- phase: pre
  derive:
    field: system
    sql: '''rideflow'''

source:
  type: table
  path: table:{domain_catalog}.{silver_layer}_rideflow_rider_app_events
  load_mode: incremental
  watermark_field: _lakelogic_processed_at

metadata:
  run_log_table: '{domain_catalog}.lakelogic_run_log'
