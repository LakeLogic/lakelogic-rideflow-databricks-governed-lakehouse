version: 1.0.0

info:
  title: Gold — Dim Cancel Reason Code
  target_layer: gold
  description: The table holds standardized codes that describe why a ride was canceled,
    along with a unique identifier for each code and the originating system. It comes
    from the rideflow system and is designed to ensure data consistency and support
    analysis of cancellation trends across the marketplace domain.
  table_name: '{gold_layer}_dim_cancel_reason_code'
  system: rideflow
  domain: marketplace

model:
  fields:
  - name: cancel_reason_code_sk
    type: string
    required: false
    description: 'Surrogate key: sha256 of the business key, written by the materializer;
      ''-1'' is the unknown member.'
  - name: cancel_reason_code
    type: string
    required: true
    description: The specific code representing the reason a ride was canceled, used
      for analysis and reporting.
  - name: system
    type: string
    required: true
    description: Source system this row came from

dataset: gold_dim_cancel_reason_code

primary_key:
- cancel_reason_code

quality:
  dataset_rules:
  - unique:
      columns:
      - cancel_reason_code
      name: cancel_reason_code_unique
      category: uniqueness
      description: No two rows share the same cancel_reason_code.

materialization:
  scd1:
    surrogate_key: cancel_reason_code_sk
    surrogate_key_strategy: hash
    unknown_member:
      enabled: true
      surrogate_key_value: '-1'

transformations:
- phase: pre
  sql: |-
    SELECT DISTINCT cancel_reason_code
    FROM source
    WHERE cancel_reason_code IS NOT NULL
- phase: pre
  derive:
    field: system
    sql: '''rideflow'''

source:
  type: table
  path: table:{domain_catalog}.{silver_layer}_rideflow_trip_cancellations
  load_mode: incremental
  watermark_field: _lakelogic_processed_at

metadata:
  run_log_table: '{domain_catalog}.lakelogic_run_log'
