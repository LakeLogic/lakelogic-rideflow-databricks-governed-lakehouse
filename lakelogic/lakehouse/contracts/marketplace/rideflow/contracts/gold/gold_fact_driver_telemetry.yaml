version: 1.0.0

info:
  title: Gold — Fact Driver Telemetry
  target_layer: gold
  description: The table holds detailed telemetry records for drivers, capturing essential
    metrics such as speed, direction, and GPS accuracy during trips. Each record is
    uniquely identified and linked to specific drivers and their statuses, enabling
    comprehensive analysis of driving behavior and performance. The data originates
    from various source systems and is enriched with references to driver profiles
    and telemetry status information.
  table_name: '{gold_layer}_fact_driver_telemetry'
  system: rideflow
  domain: marketplace

model:
  fields:
  - name: telemetry_id
    type: string
    required: true
    description: Unique identifier for each telemetry record, ensuring each data point
      can be traced and referenced.
  - name: speed_kmh
    type: float
    required: false
    description: Speed of the driver in kilometers per hour, providing insight into
      driving behavior and performance.
  - name: trip_id
    type: string
    required: false
    description: Identifier for the trip associated with the telemetry data, linking
      records to specific customer journeys.
  - name: timestamp
    type: timestamp
    required: false
    description: Timestamp indicating when the telemetry data was recorded, essential
      for time-series analysis and auditing.
  - name: heading
    type: string
    required: false
    description: Direction the driver is heading in degrees, useful for route analysis
      and navigation purposes.
  - name: accuracy_meters
    type: string
    required: false
    description: Accuracy of the GPS measurement in meters, indicating the precision
      of the location data.
  - name: driver_sk
    type: string
    required: true
    foreign_key:
      contract: gold_dim_driver_profiles
      column: driver_profiles_sk
    description: Surrogate key of gold_dim_driver_profiles, looked up on its business
      key; '-1' when the dimension does not know the row.
  - name: status_sk
    type: string
    required: true
    foreign_key:
      contract: gold_dim_driver_telemetry_status
      column: status_sk
    description: Surrogate key of gold_dim_driver_telemetry_status, looked up on its
      business key; '-1' when the dimension does not know the row.
  - name: timestamp_date
    type: date
    required: false
    description: 'Partition column: the calendar date of `timestamp`.'
  - name: system
    type: string
    required: true
    description: Source system this row came from

dataset: gold_fact_driver_telemetry

primary_key:
- telemetry_id

quality:
  dataset_rules:
  - unique:
      columns:
      - telemetry_id
      name: telemetry_id_unique
      category: uniqueness
      description: No two rows share the same telemetry_id.
  - name: driver_sk_unknown_member_rows
    sql: SELECT COUNT(*) FROM {dataset} WHERE driver_sk = '-1'
    must_be_less_than: 1
    severity: warning
    category: consistency
    description: Rows whose driver_sk fell back to the unknown member — the dimension
      did not know them when this fact ran.
  - name: status_sk_unknown_member_rows
    sql: SELECT COUNT(*) FROM {dataset} WHERE status_sk = '-1'
    must_be_less_than: 1
    severity: warning
    category: consistency
    description: Rows whose status_sk fell back to the unknown member — the dimension
      did not know them when this fact ran.

transformations:
- phase: pre
  sql: |-
    SELECT
      r.telemetry_id,
      r.trip_id,
      r.timestamp,
      r.heading,
      r.accuracy_meters,
      r.speed_kmh AS speed_kmh,
      COALESCE(d1.driver_profiles_sk, '-1') AS driver_sk,
      COALESCE(d2.status_sk, '-1') AS status_sk,
      CAST(r.timestamp AS DATE) AS timestamp_date
    FROM source r
    LEFT JOIN gold_dim_driver_profiles d1
      ON  r.driver_id = d1.driver_id
    LEFT JOIN gold_dim_driver_telemetry_status d2
      ON  r.status = d2.status
- phase: pre
  derive:
    field: system
    sql: '''rideflow'''

links:
- name: gold_dim_driver_profiles
  type: table
  path: table:{domain_catalog}.{gold_layer}_dim_driver_profiles
- name: gold_dim_driver_telemetry_status
  type: table
  path: table:{domain_catalog}.{gold_layer}_dim_driver_telemetry_status

upstream:
- gold_dim_driver_profiles
- gold_dim_driver_telemetry_status

materialization:
  strategy: append
  fact:
    type: transaction
  partition_by:
  - timestamp_date

source:
  type: table
  path: table:{domain_catalog}.{silver_layer}_rideflow_driver_telemetry
  load_mode: incremental
  watermark_field: _lakelogic_processed_at

metadata:
  run_log_table: '{domain_catalog}.lakelogic_run_log'
