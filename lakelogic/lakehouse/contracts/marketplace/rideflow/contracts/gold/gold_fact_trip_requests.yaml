version: 1.0.0

info:
  title: Gold — Fact Trip Requests
  target_layer: gold
  description: The table captures key details about each ride request made through
    the ride-sharing platform, including estimated costs, wait times, and surge pricing
    factors, along with timestamps and location codes to support analysis of service
    performance and demand patterns. It links each request to rider profiles and trip
    types for enriched reporting. The data originates from the ride-sharing system's
    gold layer, ensuring high-quality, aggregated information for marketplace analytics.
  table_name: '{gold_layer}_fact_trip_requests'
  system: rideflow
  domain: marketplace

model:
  fields:
  - name: request_id
    type: string
    required: true
    description: Unique identifier for the ride request, used to track and reference
      each individual trip request.
  - name: estimated_fare
    type: float
    required: false
    description: Estimated cost of the ride, helping riders understand expected payment
      before confirming the request.
  - name: estimated_eta_minutes
    type: float
    required: false
    description: Estimated time in minutes for the ride to be completed, setting rider
      expectations for wait time.
  - name: surge_multiplier
    type: float
    required: false
    description: Multiplier indicating surge pricing applied to the ride, reflecting
      demand fluctuations and dynamic pricing.
  - name: requested_at
    type: timestamp
    required: false
    description: Timestamp indicating when the ride was requested, crucial for timing
      analysis and service performance metrics.
  - name: city_code
    type: string
    required: false
    description: Code representing the city where the ride is requested, used for
      regional analysis and reporting.
  - name: rider_sk
    type: string
    required: true
    foreign_key:
      contract: gold_dim_rider_profiles
      column: rider_profiles_sk
    description: Surrogate key of gold_dim_rider_profiles, looked up on its business
      key; '-1' when the dimension does not know the row.
  - name: trip_type_sk
    type: string
    required: true
    foreign_key:
      contract: gold_dim_trip_type
      column: trip_type_sk
    description: Surrogate key of gold_dim_trip_type, looked up on its business key;
      '-1' when the dimension does not know the row.
  - name: requested_date
    type: date
    required: false
    description: 'Partition column: the calendar date of `requested_at`.'
  - name: system
    type: string
    required: true
    description: Source system this row came from

dataset: gold_fact_trip_requests

primary_key:
- request_id

quality:
  dataset_rules:
  - unique:
      columns:
      - request_id
      name: request_id_unique
      category: uniqueness
      description: No two rows share the same request_id.
  - name: rider_sk_unknown_member_rows
    sql: SELECT COUNT(*) FROM {dataset} WHERE rider_sk = '-1'
    must_be_less_than: 1
    severity: warning
    category: consistency
    description: Rows whose rider_sk fell back to the unknown member — the dimension
      did not know them when this fact ran.
  - name: trip_type_sk_unknown_member_rows
    sql: SELECT COUNT(*) FROM {dataset} WHERE trip_type_sk = '-1'
    must_be_less_than: 1
    severity: warning
    category: consistency
    description: Rows whose trip_type_sk fell back to the unknown member — the dimension
      did not know them when this fact ran.

transformations:
- phase: pre
  sql: |-
    SELECT
      r.request_id,
      r.requested_at,
      r.city_code,
      r.estimated_fare AS estimated_fare,
      r.estimated_eta_minutes AS estimated_eta_minutes,
      r.surge_multiplier AS surge_multiplier,
      COALESCE(d1.rider_profiles_sk, '-1') AS rider_sk,
      COALESCE(d2.trip_type_sk, '-1') AS trip_type_sk,
      CAST(r.requested_at AS DATE) AS requested_date
    FROM source r
    LEFT JOIN gold_dim_rider_profiles d1
      ON  r.rider_id = d1.rider_id
    LEFT JOIN gold_dim_trip_type d2
      ON  r.trip_type = d2.trip_type
- phase: pre
  derive:
    field: system
    sql: '''rideflow'''

links:
- name: gold_dim_rider_profiles
  type: table
  path: table:{domain_catalog}.{gold_layer}_dim_rider_profiles
- name: gold_dim_trip_type
  type: table
  path: table:{domain_catalog}.{gold_layer}_dim_trip_type

upstream:
- gold_dim_rider_profiles
- gold_dim_trip_type

materialization:
  strategy: append
  fact:
    type: transaction
  partition_by:
  - requested_date

source:
  type: table
  path: table:{domain_catalog}.{silver_layer}_rideflow_trip_requests
  load_mode: incremental
  watermark_field: _lakelogic_processed_at

metadata:
  run_log_table: '{domain_catalog}.lakelogic_run_log'
