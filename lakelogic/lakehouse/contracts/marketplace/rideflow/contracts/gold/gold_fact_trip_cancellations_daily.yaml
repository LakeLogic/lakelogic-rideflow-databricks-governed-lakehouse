version: 1.0.0

info:
  title: Gold — Fact Trip Cancellations Daily
  target_layer: gold
  description: The table records each day's trip cancellations within the rideflow
    marketplace, capturing the exact date of cancellation for analytical purposes,
    the optional fee amount applied to the cancellation for financial tracking, and
    a numeric date key for integration with date dimension tables, along with an identifier
    for the originating system to support data lineage verification.
  table_name: '{gold_layer}_fact_trip_cancellations_daily'
  system: rideflow
  domain: marketplace

model:
  fields:
  - name: activity_date
    type: date
    required: true
    description: The date when the trip cancellation occurred, used for time-based
      analysis and reporting.
  - name: cancellation_fee_amount
    type: float
    required: false
    description: The monetary amount charged as a fee for the trip cancellation, important
      for revenue tracking and financial analysis.
  - name: date_key
    type: integer
    required: false
    foreign_key:
      contract: gold_dim_date
      column: date_key
    description: The day of activity_date as YYYYMMDD — the key of the date dimension.
  - name: system
    type: string
    required: true
    description: Source system this row came from

dataset: gold_fact_trip_cancellations_daily

primary_key:
- activity_date

quality:
  dataset_rules:
  - unique:
      columns:
      - activity_date
      name: activity_date_unique
      category: uniqueness
      description: No two rows share the same activity_date.

transformations:
- phase: pre
  sql: |-
    WITH touched AS (
      SELECT DISTINCT
        CAST(requested_at AS DATE) AS _touched_0
      FROM source
    ),
    r AS (
      SELECT
        CAST(requested_at AS DATE) AS activity_date,
        SUM(cancellation_fee) AS cancellation_fee_amount
      FROM silver_rideflow_trip_cancellations_full
      JOIN touched
        ON CAST(requested_at AS DATE) = touched._touched_0
      GROUP BY CAST(requested_at AS DATE)
    )
    SELECT
      r.activity_date,
      r.cancellation_fee_amount,
      CAST(EXTRACT(YEAR FROM r.activity_date) AS BIGINT) * 10000 + CAST(EXTRACT(MONTH FROM r.activity_date) AS BIGINT) * 100 + CAST(EXTRACT(DAY FROM r.activity_date) AS BIGINT) AS date_key
    FROM r
- phase: pre
  derive:
    field: system
    sql: '''rideflow'''

links:
- name: silver_rideflow_trip_cancellations_full
  type: table
  path: table:{domain_catalog}.{silver_layer}_rideflow_trip_cancellations

upstream: []

materialization:
  fact:
    type: aggregate

source:
  type: table
  path: table:{domain_catalog}.{silver_layer}_rideflow_trip_cancellations
  load_mode: incremental
  watermark_field: _lakelogic_processed_at

metadata:
  run_log_table: '{domain_catalog}.lakelogic_run_log'
