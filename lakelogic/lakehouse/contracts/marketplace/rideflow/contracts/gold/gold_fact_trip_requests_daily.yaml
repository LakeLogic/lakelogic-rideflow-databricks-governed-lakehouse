version: 1.0.0

info:
  title: Gold — Fact Trip Requests Daily
  target_layer: gold
  description: The table aggregates daily ride request metrics from the rideflow system,
    capturing key marketplace activity indicators such as estimated fares, average
    arrival times, and surge pricing multipliers for each activity date. It includes
    a numeric date key for integration with other date-dimensional data sets, reflecting
    the system origin for each recorded metric. The data is derived from ride request
    activity captured within the rideflow platform.
  table_name: '{gold_layer}_fact_trip_requests_daily'
  system: rideflow
  domain: marketplace

model:
  fields:
  - name: activity_date
    type: date
    required: true
    description: The date on which the ride request activity occurred.
  - name: estimated_fare
    type: float
    required: false
    description: The total estimated fare for all ride requests on the given date,
      aggregated from source data.
  - name: estimated_eta_minutes
    type: float
    required: false
    description: The average estimated time (in minutes) for ride arrivals across
      all requests on the date.
  - name: surge_multiplier
    type: float
    required: false
    description: The average surge pricing multiplier applied to rides on the given
      date.
  - name: date_key
    type: integer
    required: false
    foreign_key:
      contract: gold_dim_date
      column: date_key
    description: The day of activity_date as YYYYMMDD — the key of the date dimension.
  - name: system
    type: string
    required: true
    description: Source system this row came from

dataset: gold_fact_trip_requests_daily

primary_key:
- activity_date

quality:
  dataset_rules:
  - unique:
      columns:
      - activity_date
      name: activity_date_unique
      category: uniqueness
      description: No two rows share the same activity_date.

transformations:
- phase: pre
  sql: |-
    WITH touched AS (
      SELECT DISTINCT
        CAST(requested_at AS DATE) AS _touched_0
      FROM source
    ),
    r AS (
      SELECT
        CAST(requested_at AS DATE) AS activity_date,
        SUM(estimated_fare) AS estimated_fare,
        AVG(estimated_eta_minutes) AS estimated_eta_minutes,
        AVG(surge_multiplier) AS surge_multiplier
      FROM silver_rideflow_trip_requests_full
      JOIN touched
        ON CAST(requested_at AS DATE) = touched._touched_0
      GROUP BY CAST(requested_at AS DATE)
    )
    SELECT
      r.activity_date,
      r.estimated_fare,
      r.estimated_eta_minutes,
      r.surge_multiplier,
      CAST(EXTRACT(YEAR FROM r.activity_date) AS BIGINT) * 10000 + CAST(EXTRACT(MONTH FROM r.activity_date) AS BIGINT) * 100 + CAST(EXTRACT(DAY FROM r.activity_date) AS BIGINT) AS date_key
    FROM r
- phase: pre
  derive:
    field: system
    sql: '''rideflow'''

links:
- name: silver_rideflow_trip_requests_full
  type: table
  path: table:{domain_catalog}.{silver_layer}_rideflow_trip_requests

upstream: []

materialization:
  fact:
    type: aggregate

source:
  type: table
  path: table:{domain_catalog}.{silver_layer}_rideflow_trip_requests
  load_mode: incremental
  watermark_field: _lakelogic_processed_at

metadata:
  run_log_table: '{domain_catalog}.lakelogic_run_log'
