version: 1.0.0

info:
  title: Silver — Rideflow Trips
  target_layer: silver
  table_name: '{silver_layer}_rideflow_trips'
  system: rideflow
  domain: marketplace

model:
  fields:
  - name: trip_id
    type: string
    required: true
  - name: rider_id
    type: string
    required: true
  - name: driver_id
    type: string
    required: true
  - name: trip_type
    type: string
    required: false
  - name: pickup_lat
    type: float
    required: false
    pii: true
    classification: gps_coordinate
    description: Personal data (gps_coordinate), real values here, masked at gold
      (redact).
  - name: pickup_lng
    type: float
    required: false
    pii: true
    classification: gps_coordinate
    description: Personal data (gps_coordinate), real values here, masked at gold
      (redact).
  - name: dropoff_lat
    type: float
    required: false
    pii: true
    classification: gps_coordinate
    description: Personal data (gps_coordinate), real values here, masked at gold
      (redact).
  - name: dropoff_lng
    type: float
    required: false
    pii: true
    classification: gps_coordinate
    description: Personal data (gps_coordinate), real values here, masked at gold
      (redact).
  - name: city_code
    type: string
    required: false
  - name: country_code
    type: string
    required: false
  - name: requested_at
    type: timestamp
    required: false
  - name: pickup_at
    type: timestamp
    required: false
  - name: dropoff_at
    type: timestamp
    required: false
  - name: distance_km
    type: float
    required: false
  - name: duration_minutes
    type: integer
    required: false
  - name: fare_amount
    type: float
    required: false
  - name: surge_multiplier
    type: float
    required: false
  - name: tip_amount
    type: float
    required: false
  - name: payment_method
    type: string
    required: false
  - name: rider_rating
    type: float
    required: false
  - name: driver_rating
    type: float
    required: false
  - name: notes
    type: string
    required: false
  - name: dropoff_date
    type: date
    required: false
    description: 'Partition column: the calendar date of `dropoff_at`.'

primary_key:
- trip_id

quality:
  row_rules:
  - name: trip_id_not_null
    sql: trip_id IS NOT NULL
    category: completeness
    description: trip_id is always present (never null).
  - name: rider_id_not_null
    sql: rider_id IS NOT NULL
    category: completeness
    description: rider_id is always present (never null).
  - name: driver_id_not_null
    sql: driver_id IS NOT NULL
    category: completeness
    description: driver_id is always present (never null).
  - name: trip_id_not_null
    sql: trip_id IS NOT NULL
    category: completeness
    description: trip_id is always present (never null).
  - name: pickup_lat_range_min
    sql: pickup_lat IS NULL OR pickup_lat >= -90.0
    category: validity
    description: pickup_lat is at least -90.0 when present.
  - name: pickup_lat_range_max
    sql: pickup_lat IS NULL OR pickup_lat <= 90.0
    category: validity
    description: pickup_lat is at most 90.0 when present.
  - name: pickup_lng_range_min
    sql: pickup_lng IS NULL OR pickup_lng >= -180.0
    category: validity
    description: pickup_lng is at least -180.0 when present.
  - name: pickup_lng_range_max
    sql: pickup_lng IS NULL OR pickup_lng <= 180.0
    category: validity
    description: pickup_lng is at most 180.0 when present.
  - name: dropoff_lat_range_min
    sql: dropoff_lat IS NULL OR dropoff_lat >= -90.0
    category: validity
    description: dropoff_lat is at least -90.0 when present.
  - name: dropoff_lat_range_max
    sql: dropoff_lat IS NULL OR dropoff_lat <= 90.0
    category: validity
    description: dropoff_lat is at most 90.0 when present.
  - name: dropoff_lng_range_min
    sql: dropoff_lng IS NULL OR dropoff_lng >= -180.0
    category: validity
    description: dropoff_lng is at least -180.0 when present.
  - name: dropoff_lng_range_max
    sql: dropoff_lng IS NULL OR dropoff_lng <= 180.0
    category: validity
    description: dropoff_lng is at most 180.0 when present.

transformations:
- phase: pre
  derive:
    field: dropoff_date
    sql: CAST(dropoff_at AS DATE)
- deduplicate:
    by:
    - trip_id
    sort_by:
    - dropoff_at
    order: desc

materialization:
  partition_by:
  - country_code
  - dropoff_date

dataset: silver_rideflow_trips

source:
  type: table
  path: table:{domain_catalog}.{bronze_layer}_rideflow_trips
  load_mode: incremental
  watermark_field: _lakelogic_processed_at

metadata:
  run_log_table: '{domain_catalog}.lakelogic_run_log'
