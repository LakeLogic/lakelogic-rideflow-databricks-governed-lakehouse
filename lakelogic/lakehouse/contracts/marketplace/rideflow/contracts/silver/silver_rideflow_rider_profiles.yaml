version: 1.0.0

info:
  title: Silver — Rideflow Rider Profiles
  target_layer: silver
  description: The table holds detailed profiles of riders on the marketplace platform,
    including personal identifiers such as names, email addresses, phone numbers,
    dates of birth, and home addresses, which are essential for account management,
    communication, and verification. It also contains registration and status information
    that helps track rider activity and service eligibility, along with preferences
    like the chosen payment method. The data originates from the rideflow system,
    where rider information is captured and maintained for operational and analytical
    purposes.
  table_name: '{silver_layer}_rideflow_rider_profiles'
  system: rideflow
  domain: marketplace

model:
  fields:
  - name: rider_id
    type: string
    required: true
    description: Unique identifier for the rider, essential for linking rider data
      across systems and processes.
  - name: name
    type: string
    required: false
    pii: true
    classification: person_name
    description: Full name of the rider, used for personal identification and communication.
  - name: email
    type: string
    required: false
    pii: true
    classification: email
    description: Email address of the rider for account management and notifications.
  - name: phone
    type: string
    required: false
    pii: true
    classification: phone
    description: Phone number of the rider for contact and verification purposes.
  - name: date_of_birth
    type: string
    required: false
    pii: true
    classification: date_of_birth
    description: Date of birth of the rider, used for age verification and personalization.
  - name: home_address
    type: string
    required: false
    pii: true
    classification: postal_address
    description: Home address of the rider, used for delivery and service area determination.
  - name: city_code
    type: string
    required: false
    description: Code representing the city where the rider is located, aiding in
      regional analysis and services.
  - name: country_code
    type: string
    required: false
    description: Code representing the country of the rider, important for compliance
      and regional segmentation.
  - name: signup_date
    type: date
    required: false
    description: Date when the rider registered, indicating the duration of their
      association with the platform.
  - name: status
    type: string
    required: false
    description: Current status of the rider's account, indicating activity level
      or special conditions.
  - name: preferred_payment_method
    type: string
    required: false
    description: Rider's preferred method of payment, streamlining the checkout process.
  - name: updated_at
    type: timestamp
    required: false
    description: Timestamp of the last update to the rider's profile, ensuring data
      freshness and accuracy.

primary_key:
- rider_id

quality:
  row_rules:
  - name: rider_id_not_null
    sql: rider_id IS NOT NULL
    category: completeness
    description: rider_id is always present (never null).
  - name: rider_id_not_null
    sql: rider_id IS NOT NULL
    category: completeness
    description: rider_id is always present (never null).

transformations:
- deduplicate:
    by:
    - rider_id
    sort_by:
    - updated_at
    order: desc

materialization:
  partition_by:
  - country_code

dataset: silver_rideflow_rider_profiles

source:
  type: table
  path: table:{domain_catalog}.{bronze_layer}_rideflow_rider_profiles
  load_mode: incremental
  watermark_field: _lakelogic_processed_at

metadata:
  run_log_table: '{domain_catalog}.lakelogic_run_log'
