version: 1.0.0

info:
  title: Silver — Rideflow Driver Profiles
  target_layer: silver
  description: The table holds detailed profiles of drivers registered on the rideflow
    platform, including personal identification and contact information, vehicle details,
    and operational status. It captures sensitive personal data such as names, email
    addresses, phone numbers, and bank account information, essential for account
    management, compliance, and service delivery. The data originates from the rideflow
    system, reflecting each driver's current status, ratings from passengers, and
    registration details.
  table_name: '{silver_layer}_rideflow_driver_profiles'
  system: rideflow
  domain: marketplace

model:
  fields:
  - name: driver_id
    type: string
    required: true
    description: Unique identifier for the driver within the rideflow system.
  - name: name
    type: string
    required: false
    pii: true
    classification: person_name
    description: Full name of the driver, used for identification and communication.
  - name: email
    type: string
    required: false
    pii: true
    classification: email
    description: Email address of the driver for account management and notifications.
  - name: phone
    type: string
    required: false
    pii: true
    classification: phone
    description: Phone number of the driver for contact and emergency purposes.
  - name: date_of_birth
    type: string
    required: false
    pii: true
    classification: date_of_birth
    description: Driver's date of birth, used for age verification and compliance.
  - name: home_address
    type: string
    required: false
    pii: true
    classification: postal_address
    description: Home address of the driver, used for location and delivery purposes.
  - name: licence_number
    type: string
    required: false
    pii: true
    classification: licence_id
    description: Driver's licence number, required for legal operation of the vehicle.
  - name: licence_plate
    type: string
    required: false
    pii: true
    classification: licence_plate
    description: Vehicle licence plate number, used for vehicle identification and
      tracking.
  - name: vehicle_type
    type: string
    required: false
    description: Type of vehicle used by the driver, important for service matching.
  - name: bank_account_last_four
    type: string
    required: false
    sensitive: true
    classification: financial_account
    description: Last four digits of the driver's bank account, used for payment verification.
  - name: city_code
    type: string
    required: false
    description: Code representing the city where the driver is based, for location-based
      services.
  - name: country_code
    type: string
    required: false
    description: Code representing the country of the driver, for regional compliance
      and services.
  - name: signup_date
    type: date
    required: false
    description: Date when the driver joined the rideflow platform.
  - name: status
    type: string
    required: false
    description: Current operational status of the driver (e.g., active, inactive).
  - name: rating
    type: float
    required: false
    description: Overall rating of the driver based on passenger feedback.
  - name: updated_at
    type: timestamp
    required: false
    description: Timestamp indicating the last update time of the driver's profile.

primary_key:
- driver_id

quality:
  row_rules:
  - name: driver_id_not_null
    sql: driver_id IS NOT NULL
    category: completeness
    description: driver_id is always present (never null).
  - name: driver_id_not_null
    sql: driver_id IS NOT NULL
    category: completeness
    description: driver_id is always present (never null).

transformations:
- deduplicate:
    by:
    - driver_id
    sort_by:
    - updated_at
    order: desc

materialization:
  partition_by:
  - country_code

dataset: silver_rideflow_driver_profiles

source:
  type: table
  path: table:{domain_catalog}.{bronze_layer}_rideflow_driver_profiles
  load_mode: incremental
  watermark_field: _lakelogic_processed_at

metadata:
  run_log_table: '{domain_catalog}.lakelogic_run_log'
