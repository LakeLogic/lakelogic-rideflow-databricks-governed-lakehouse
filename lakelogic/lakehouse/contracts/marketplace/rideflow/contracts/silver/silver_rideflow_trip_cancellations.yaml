version: 1.0.0

info:
  title: Silver — Rideflow Trip Cancellations
  target_layer: silver
  description: The table records each instance where a ride was cancelled in the marketplace,
    capturing details such as the unique cancellation identifier, the associated trip,
    rider, and driver, the party initiating the cancellation, the reason for cancellation,
    location details, timestamps for when the cancellation was requested and finalized,
    and any associated cancellation fee. It enables analysis of cancellation trends,
    rider and driver behavior, financial tracking of cancellation fees, and regional
    or compliance-based reporting.
  table_name: '{silver_layer}_rideflow_trip_cancellations'
  system: rideflow
  domain: marketplace

model:
  fields:
  - name: cancellation_id
    type: string
    required: true
    description: Unique identifier for the cancellation event, used to track and reference
      each cancellation record.
  - name: trip_id
    type: string
    required: true
    description: Identifier for the trip that was cancelled, linking the cancellation
      to the original trip details.
  - name: rider_id
    type: string
    required: true
    description: Identifier for the rider who requested or experienced the cancellation,
      used to analyze rider behavior and satisfaction.
  - name: driver_id
    type: string
    required: true
    description: Identifier for the driver involved in the cancelled trip, used to
      assess driver performance and issues.
  - name: cancelled_by
    type: string
    required: false
    description: Indicates whether the cancellation was initiated by the rider or
      the driver, helping to understand cancellation trends and reasons.
  - name: cancel_reason_code
    type: string
    required: false
    description: Code representing the reason for the cancellation, used for categorizing
      and analyzing cancellation causes.
  - name: city_code
    type: string
    required: false
    description: Code representing the city where the cancellation occurred, used
      for regional analysis and reporting.
  - name: country_code
    type: string
    required: false
    description: Code representing the country where the cancellation occurred, used
      for country-level analysis and compliance.
  - name: requested_at
    type: timestamp
    required: false
    description: Timestamp indicating when the cancellation was requested, used to
      track the timing and pattern of cancellations.
  - name: cancelled_at
    type: timestamp
    required: false
    description: Timestamp indicating when the cancellation was finalized, used to
      measure cancellation processing times.
  - name: cancellation_fee
    type: float
    required: false
    description: Fee applied for the cancellation, used for financial tracking and
      policy enforcement.
  - name: cancelled_date
    type: date
    required: false
    description: 'Partition column: the calendar date of `cancelled_at`.'

primary_key:
- cancellation_id

quality:
  row_rules:
  - name: cancellation_id_not_null
    sql: cancellation_id IS NOT NULL
    category: completeness
    description: cancellation_id is always present (never null).
  - name: trip_id_not_null
    sql: trip_id IS NOT NULL
    category: completeness
    description: trip_id is always present (never null).
  - name: rider_id_not_null
    sql: rider_id IS NOT NULL
    category: completeness
    description: rider_id is always present (never null).
  - name: driver_id_not_null
    sql: driver_id IS NOT NULL
    category: completeness
    description: driver_id is always present (never null).
  - name: cancellation_id_not_null
    sql: cancellation_id IS NOT NULL
    category: completeness
    description: cancellation_id is always present (never null).

transformations:
- phase: pre
  derive:
    field: cancelled_date
    sql: CAST(cancelled_at AS DATE)
- deduplicate:
    by:
    - cancellation_id
    sort_by:
    - cancelled_at
    order: desc

materialization:
  partition_by:
  - country_code
  - cancelled_date

dataset: silver_rideflow_trip_cancellations

source:
  type: table
  path: table:{domain_catalog}.{bronze_layer}_rideflow_trip_cancellations
  load_mode: incremental
  watermark_field: _lakelogic_processed_at

metadata:
  run_log_table: '{domain_catalog}.lakelogic_run_log'
