version: 1.0.0

info:
  title: Bronze — Rideflow Rider App Events
  target_layer: bronze
  description: The table records user interactions within the Rideflow rider application,
    capturing details such as the unique event identifier, the rider involved, the
    device and network address used, the specific action and screen where it occurred,
    the time of the event, app and platform version, and location data including city
    and country codes. It includes personally identifiable information such as device
    IDs and IP addresses, and stores additional variable event properties in a JSON
    format for flexible data capture.
  table_name: '{bronze_layer}_rideflow_rider_app_events'
  domain: marketplace
  system: rideflow

model:
  fields:
  - name: event_id
    type: string
    description: Unique identifier for each event, ensuring each event instance is
      trackable and analyzable.
  - name: rider_id
    type: string
    description: Identifier for the rider generating the event, linking events to
      specific users for behavior analysis and service improvement.
  - name: device_id
    type: string
    pii: true
    classification: device_id
    description: Identifier of the device used to generate the event; useful for understanding
      device-specific usage patterns and troubleshooting.
  - name: ip_address
    type: string
    pii: true
    classification: ip_address
    description: Network address where the event originated; helps in geolocation
      and monitoring user access patterns.
  - name: event_name
    type: string
    description: Name of the event occurring within the app, categorizing user actions
      for analytical and diagnostic purposes.
  - name: screen_name
    type: string
    description: Name of the app screen where the event occurred, providing context
      to user interactions and navigation flow.
  - name: event_timestamp
    type: timestamp
    description: Timestamp indicating when the event occurred, essential for time-based
      analysis and sequencing of user activities.
  - name: app_version
    type: string
    description: Version of the app in use when the event was triggered, important
      for identifying issues or features specific to certain app releases.
  - name: platform
    type: string
    description: Platform on which the app is running (e.g., iOS, Android), aiding
      in platform-specific analysis and optimization.
  - name: city_code
    type: string
    description: Code representing the city where the event took place, useful for
      localized analysis and regional service adjustments.
  - name: country_code
    type: string
    description: Code representing the country where the event took place, supporting
      country-level analytics and compliance checks.
  - name: event_properties_json
    type: string
    description: JSON object containing additional event-specific properties, offering
      flexible storage of varied data points for detailed event analysis.

source:
  type: landing
  path: '{landing_root}/rider_app_events'
  load_mode: full

quality:
  row_rules:
  - name: country_code_partition_not_null
    sql: country_code IS NOT NULL
    category: completeness
    description: country_code is always present (never null).

materialization:
  partition_by:
  - country_code

dataset: bronze_rideflow_rider_app_events
