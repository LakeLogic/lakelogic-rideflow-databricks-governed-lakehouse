version: 1.0.0

info:
  title: Bronze — Rideflow Rider Profiles
  target_layer: bronze
  description: The table contains personal details and contact information for riders
    on the marketplace, including their names, email addresses, phone numbers, dates
    of birth, home addresses, and registration dates, which are essential for account
    management, communication, and verification purposes. It also includes geographical
    identifiers such as city and country codes to support regional analysis and compliance.
    The data is marked for personal identification information, highlighting its sensitivity
    and the need for careful handling.
  table_name: '{bronze_layer}_rideflow_rider_profiles'
  domain: marketplace
  system: rideflow

model:
  fields:
  - name: rider_id
    type: string
    description: Unique identifier for the rider, essential for linking rider data
      across systems and processes.
  - name: name
    type: string
    pii: true
    classification: person_name
    description: Full name of the rider, used for personal identification and communication.
  - name: email
    type: string
    pii: true
    classification: email
    description: Email address of the rider for account management and notifications.
  - name: phone
    type: string
    pii: true
    classification: phone
    description: Phone number of the rider for contact and verification purposes.
  - name: date_of_birth
    type: string
    pii: true
    classification: date_of_birth
    description: Date of birth of the rider, used for age verification and personalization.
  - name: home_address
    type: string
    pii: true
    classification: postal_address
    description: Home address of the rider, used for delivery and service area determination.
  - name: city_code
    type: string
    description: Code representing the city where the rider is located, aiding in
      regional analysis and services.
  - name: country_code
    type: string
    description: Code representing the country of the rider, important for compliance
      and regional segmentation.
  - name: signup_date
    type: date
    description: Date when the rider registered, indicating the duration of their
      association with the platform.
  - name: status
    type: string
    description: Current status of the rider's account, indicating activity level
      or special conditions.
  - name: preferred_payment_method
    type: string
    description: Rider's preferred method of payment, streamlining the checkout process.
  - name: updated_at
    type: timestamp
    description: Timestamp of the last update to the rider's profile, ensuring data
      freshness and accuracy.

source:
  type: landing
  path: '{landing_root}/rider_profiles'
  load_mode: full

quality:
  row_rules:
  - name: country_code_partition_not_null
    sql: country_code IS NOT NULL
    category: completeness
    description: country_code is always present (never null).

materialization:
  partition_by:
  - country_code

dataset: bronze_rideflow_rider_profiles
