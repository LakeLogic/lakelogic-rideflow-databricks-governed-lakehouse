version: 1.0.0

info:
  title: Gold — Fact Fx Rates Daily
  target_layer: gold
  description: 'grain: one row per day and currency pair'
  table_name: '{gold_layer}_fact_fx_rates_daily'
  system: internal
  domain: reference

model:
  fields:
  - name: rate_date
    type: date
    required: true
    description: The date for which the exchange rate is valid, ensuring temporal
      alignment of financial data.
  - name: base_currency
    type: string
    required: true
    description: The currency used as the reference point in the exchange rate calculation.
  - name: quote_currency
    type: string
    required: true
    description: The currency being priced relative to the base currency in the exchange
      rate.
  - name: rate
    type: float
    required: false
    description: The exchange rate value indicating how much of the quote currency
      one unit of the base currency can buy.
  - name: source_feed
    type: string
    required: false
    description: The origin or system providing the exchange rate data, supporting
      auditability and data lineage tracking.
  - name: system
    type: string
    required: true
    description: Source system this row came from

dataset: gold_fact_fx_rates_daily

primary_key:
- rate_date
- base_currency
- quote_currency

quality:
  dataset_rules:
  - unique:
      columns:
      - rate_date
      - base_currency
      - quote_currency
      name: rate_date_base_currency_quote_currency_unique
      category: uniqueness
      description: No two rows share the same rate_date, base_currency, quote_currency.

transformations:
- phase: pre
  sql: |-
    SELECT
      r.rate_date,
      r.base_currency,
      r.quote_currency,
      r.source_feed,
      r.rate AS rate
    FROM source r
- phase: pre
  derive:
    field: system
    sql: '''internal'''

materialization:
  strategy: append
  fact:
    type: transaction

source:
  type: table
  path: table:{domain_catalog}.{silver_layer}_internal_fx_rates_daily
  load_mode: incremental
  watermark_field: _lakelogic_processed_at

metadata:
  run_log_table: '{domain_catalog}.lakelogic_run_log'
