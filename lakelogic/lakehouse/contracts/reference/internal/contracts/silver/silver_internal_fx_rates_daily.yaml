version: 1.0.0

info:
  title: Silver — Internal Fx Rates Daily
  target_layer: silver
  description: The table holds daily exchange rates for various currency pairs, specifying
    the rate at which one currency can be exchanged for another on a given date. It
    includes the base currency, quote currency, and the corresponding exchange rate,
    sourced from internal systems to ensure data accuracy and traceability for financial
    reporting and analysis.
  table_name: '{silver_layer}_internal_fx_rates_daily'
  system: internal
  domain: reference

model:
  fields:
  - name: rate_date
    type: date
    required: true
    description: The date for which the exchange rate is valid, ensuring temporal
      alignment of financial data.
  - name: base_currency
    type: string
    required: true
    description: The currency used as the reference point in the exchange rate calculation.
  - name: quote_currency
    type: string
    required: true
    description: The currency being priced relative to the base currency in the exchange
      rate.
  - name: rate
    type: float
    required: false
    description: The exchange rate value indicating how much of the quote currency
      one unit of the base currency can buy.
  - name: source_feed
    type: string
    required: false
    description: The origin or system providing the exchange rate data, supporting
      auditability and data lineage tracking.

primary_key:
- rate_date
- base_currency
- quote_currency

quality:
  row_rules:
  - name: rate_date_not_null
    sql: rate_date IS NOT NULL
    category: completeness
    description: rate_date is always present (never null).
  - name: rate_date_not_null
    sql: rate_date IS NOT NULL
    category: completeness
    description: rate_date is always present (never null).
  - name: base_currency_not_null
    sql: base_currency IS NOT NULL
    category: completeness
    description: base_currency is always present (never null).
  - name: quote_currency_not_null
    sql: quote_currency IS NOT NULL
    category: completeness
    description: quote_currency is always present (never null).

transformations:
- deduplicate:
    by:
    - rate_date
    - base_currency
    - quote_currency
    sort_by:
    - _lakelogic_processed_at
    order: desc

dataset: silver_internal_fx_rates_daily

source:
  type: table
  path: table:{domain_catalog}.{bronze_layer}_internal_fx_rates_daily
  load_mode: incremental
  watermark_field: _lakelogic_processed_at

metadata:
  run_log_table: '{domain_catalog}.lakelogic_run_log'
