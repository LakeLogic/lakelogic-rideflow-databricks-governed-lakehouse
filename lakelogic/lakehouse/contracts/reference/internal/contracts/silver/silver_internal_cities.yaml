version: 1.0.0

info:
  title: Silver — Internal Cities
  target_layer: silver
  description: The table contains essential reference data for cities used across
    the organization, including unique identifiers, full city names, associated country
    codes, timezones, default currencies, and geospatial boundaries. This information
    supports regional grouping, time management, financial reporting, and location-based
    services. It also tracks the lifecycle of each city within the system through
    launch and sunset timestamps and an active status flag.
  table_name: '{silver_layer}_internal_cities'
  system: internal
  domain: reference

model:
  fields:
  - name: city_code
    type: string
    required: true
    description: Unique identifier for the city used internally for referencing and
      processing.
  - name: city_name
    type: string
    required: false
    description: Full name of the city for identification and display purposes.
  - name: country_code
    type: string
    required: false
    description: Code representing the country the city belongs to, used for regional
      grouping and analysis.
  - name: timezone
    type: string
    required: false
    description: Timezone of the city to manage time-related data accurately across
      different regions.
  - name: default_currency
    type: string
    required: false
    description: Default currency used in the city for financial transactions and
      reporting.
  - name: geofence_wkt
    type: string
    required: false
    description: Geospatial boundary definition of the city used for location-based
      services and analytics.
  - name: launched_at
    type: timestamp
    required: false
    description: Timestamp indicating when the city was added to the system, tracking
      system coverage over time.
  - name: sunset_at
    type: timestamp
    required: false
    description: Timestamp indicating when the city will be removed or deactivated
      from the system.
  - name: is_active
    type: boolean
    required: false
    description: Boolean flag indicating whether the city is currently active and
      available within the system.

primary_key:
- city_code

quality:
  row_rules:
  - name: city_code_not_null
    sql: city_code IS NOT NULL
    category: completeness
    description: city_code is always present (never null).

transformations:
- deduplicate:
    by:
    - city_code
    sort_by:
    - _lakelogic_processed_at
    order: desc

materialization:
  partition_by:
  - country_code

dataset: silver_internal_cities

source:
  type: table
  path: table:{domain_catalog}.{bronze_layer}_internal_cities
  load_mode: incremental
  watermark_field: _lakelogic_processed_at

metadata:
  run_log_table: '{domain_catalog}.lakelogic_run_log'
