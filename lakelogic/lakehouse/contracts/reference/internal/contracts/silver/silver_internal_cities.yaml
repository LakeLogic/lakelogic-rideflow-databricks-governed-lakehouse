version: 1.0.0

info:
  title: Silver — Internal Cities
  target_layer: silver
  table_name: '{silver_layer}_internal_cities'
  system: internal
  domain: reference

model:
  fields:
  - name: city_code
    type: string
    required: true
  - name: city_name
    type: string
    required: false
  - name: country_code
    type: string
    required: false
  - name: timezone
    type: string
    required: false
  - name: default_currency
    type: string
    required: false
  - name: geofence_wkt
    type: string
    required: false
  - name: launched_at
    type: timestamp
    required: false
  - name: sunset_at
    type: timestamp
    required: false
  - name: is_active
    type: boolean
    required: false

primary_key:
- city_code

quality:
  row_rules:
  - name: city_code_not_null
    sql: city_code IS NOT NULL
    category: completeness
    description: city_code is always present (never null).

transformations:
- deduplicate:
    by:
    - city_code
    sort_by:
    - _lakelogic_processed_at
    order: desc

materialization:
  partition_by:
  - country_code

dataset: silver_internal_cities

source:
  type: table
  path: table:{domain_catalog}.{bronze_layer}_internal_cities
  load_mode: incremental
  watermark_field: _lakelogic_processed_at

metadata:
  run_log_table: '{domain_catalog}.lakelogic_run_log'
