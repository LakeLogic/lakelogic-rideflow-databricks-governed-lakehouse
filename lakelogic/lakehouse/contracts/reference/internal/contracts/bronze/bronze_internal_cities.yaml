version: 1.0.0

info:
  title: Bronze — Internal Cities
  target_layer: bronze
  description: The table holds reference data for cities used internally, including
    identifiers, names, country codes, timezones, default currencies, geospatial boundaries,
    and status flags to manage active and deactivated cities. It originates from an
    internal system designed to provide consistent city information for processing,
    regional grouping, financial reporting, and location-based services. The data
    supports tracking when cities were added or scheduled for removal, ensuring accurate
    and up-to-date system coverage.
  table_name: '{bronze_layer}_internal_cities'
  domain: reference
  system: internal

model:
  fields:
  - name: city_code
    type: string
    description: Unique identifier for the city used internally for referencing and
      processing.
  - name: city_name
    type: string
    description: Full name of the city for identification and display purposes.
  - name: country_code
    type: string
    description: Code representing the country the city belongs to, used for regional
      grouping and analysis.
  - name: timezone
    type: string
    description: Timezone of the city to manage time-related data accurately across
      different regions.
  - name: default_currency
    type: string
    description: Default currency used in the city for financial transactions and
      reporting.
  - name: geofence_wkt
    type: string
    description: Geospatial boundary definition of the city used for location-based
      services and analytics.
  - name: launched_at
    type: timestamp
    description: Timestamp indicating when the city was added to the system, tracking
      system coverage over time.
  - name: sunset_at
    type: timestamp
    description: Timestamp indicating when the city will be removed or deactivated
      from the system.
  - name: is_active
    type: boolean
    description: Boolean flag indicating whether the city is currently active and
      available within the system.

source:
  type: landing
  path: '{landing_root}/cities'
  load_mode: full

primary_key:
- city_code

quality:
  row_rules:
  - name: country_code_partition_not_null
    sql: country_code IS NOT NULL
    category: completeness
    description: country_code is always present (never null).

materialization:
  partition_by:
  - country_code

dataset: bronze_internal_cities
