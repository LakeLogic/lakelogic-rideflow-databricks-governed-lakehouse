version: 1.0.0

info:
  title: Bronze — Internal Fx Rates Daily
  target_layer: bronze
  description: The table holds daily exchange rates for various currency pairs, capturing
    the value of one currency relative to another on specific dates to support financial
    reporting and analysis. It includes the base and quote currencies, the rate itself,
    and the date the rate is valid, ensuring accurate temporal alignment of financial
    data. The data originates from internal systems, with each entry tagged by the
    source feed to maintain auditability and trace data lineage.
  table_name: '{bronze_layer}_internal_fx_rates_daily'
  domain: reference
  system: internal

model:
  fields:
  - name: rate_date
    type: date
    description: The date for which the exchange rate is valid, ensuring temporal
      alignment of financial data.
  - name: base_currency
    type: string
    description: The currency used as the reference point in the exchange rate calculation.
  - name: quote_currency
    type: string
    description: The currency being priced relative to the base currency in the exchange
      rate.
  - name: rate
    type: float
    description: The exchange rate value indicating how much of the quote currency
      one unit of the base currency can buy.
  - name: source_feed
    type: string
    description: The origin or system providing the exchange rate data, supporting
      auditability and data lineage tracking.

source:
  type: landing
  path: '{landing_root}/fx_rates_daily'
  load_mode: full

primary_key:
- rate_date
- base_currency
- quote_currency

dataset: bronze_internal_fx_rates_daily
