version: 1.0.0

info:
  title: Gold — Dim Accounts (SCD2)
  target_layer: gold
  description: 'grain: one row per Salesforce account'
  table_name: '{gold_layer}_dim_accounts'
  system: salesforce
  domain: business

model:
  fields:
  - name: accounts_sk
    type: string
    required: false
    description: 'Surrogate key: sha256 of the business key and the version start,
      written by the materializer; ''-1'' is the unknown member.'
  - name: Id
    type: string
    required: true
    description: Dimension attribute 'Id', projected from the 'accounts' entity.
  - name: Type
    type: string
    required: false
    description: Dimension attribute 'Type', projected from the 'accounts' entity.
  - name: Industry
    type: string
    required: false
    description: Dimension attribute 'Industry', projected from the 'accounts' entity.
  - name: BillingCity
    type: string
    required: false
    description: Dimension attribute 'BillingCity', projected from the 'accounts'
      entity.
  - name: BillingCountry
    type: string
    required: false
    description: Dimension attribute 'BillingCountry', projected from the 'accounts'
      entity.
  - name: NumberOfEmployees
    type: Int64
    required: false
    description: Dimension attribute 'NumberOfEmployees', projected from the 'accounts'
      entity.
  - name: AnnualRevenue
    type: decimal(18,2)
    required: false
    description: Dimension attribute 'AnnualRevenue', projected from the 'accounts'
      entity.
  - name: OwnerId
    type: string
    required: false
    description: Dimension attribute 'OwnerId', projected from the 'accounts' entity.
  - name: RideFlow_Account_Code__c
    type: string
    required: false
    description: Dimension attribute 'RideFlow_Account_Code__c', projected from the
      'accounts' entity.
  - name: effective_from
    type: timestamp
    required: false
    description: SCD2 effective from, written by the materializer.
  - name: effective_to
    type: timestamp
    required: false
    description: SCD2 effective to, written by the materializer.
  - name: is_current
    type: boolean
    required: false
    description: SCD2 current flag, written by the materializer.
  - name: version_number
    type: long
    required: false
    description: SCD2 version column, written by the materializer.
  - name: system
    type: string
    required: true
    description: Source system this row came from

dataset: gold_dim_accounts

primary_key:
- Id

materialization:
  strategy: scd2
  scd2:
    surrogate_key: accounts_sk
    surrogate_key_strategy: hash
    effective_from_field: effective_from
    effective_to_field: effective_to
    current_flag_field: is_current
    version_column: version_number
    track_columns:
    - Type
    - Industry
    - BillingCity
    - BillingCountry
    - NumberOfEmployees
    - AnnualRevenue
    - OwnerId
    - RideFlow_Account_Code__c
    unknown_member:
      enabled: true
      surrogate_key_value: '-1'

quality:
  dataset_rules:
  - unique:
      columns:
      - Id
      - effective_from
      name: Id_effective_from_unique
      category: uniqueness
      description: No two rows share the same Id, effective_from.

source:
  type: table
  path: table:{silver_root}.{silver_layer}_salesforce_accounts
  load_mode: incremental
  watermark_field: _lakelogic_processed_at

metadata:
  run_log_table: '{domain_catalog}.lakelogic_run_log'

transformations:
- phase: pre
  derive:
    field: system
    sql: '''salesforce'''
