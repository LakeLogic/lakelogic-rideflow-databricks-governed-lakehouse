domain: marketing
ownership:
  domain_owner: Growth Team
  team: growth_analytics
  contacts:
  - name: Growth Data Lead
    role: oncall
    email: growth-data@rideflow.com
  cost_center: growth_marketing
  jira_project: GROWTH
slo:
  freshness:
    bronze:
      max_delay_minutes: 240
      check_columns:
      - _lakelogic_processed_at
    silver:
      max_delay_minutes: 480
      check_columns:
      - _lakelogic_processed_at
  row_count:
    bronze:
      min_rows: 1
      max_rows: 100000
      warn_only: false
      anomaly:
        enabled: true
        lookback_runs: 14
        min_ratio: 0.5
        max_ratio: 2.0
        method: median
        min_runs_before_enforcement: 5
    silver:
      min_rows: 1
      max_rows: 100000
      warn_only: false
      anomaly:
        enabled: true
        lookback_runs: 14
        min_ratio: 0.5
        max_ratio: 2.0
        method: median
        min_runs_before_enforcement: 5
  quality:
    min_good_ratio: 0.95
    max_quarantine_ratio: 0.05
    by_severity:
      critical:
        min_good_ratio: 0.999
      high:
        min_good_ratio: 0.99
      medium:
        min_good_ratio: 0.95
      low:
        min_good_ratio: 0.9
quality_coverage:
  silver:
    field_check_target: 0.7
  gold:
    require:
    - grain_unique
    - referential_integrity
cost:
  currency: GBP
  budget:
    daily_limit: 20.0
    weekly_limit: 100.0
    monthly_limit: 300.0
    per_run_anomaly_multiplier: 3.0
    alert_channels:
    - slack
    - email
observatory:
  enabled: true
  environments:
  - dev
  - prod
  - staging
  - local
  - local_polars
  endpoint: ${LAKELOGIC_OBSERVATORY_ENDPOINT}
  api_key: ${LAKELOGIC_API_KEY}
  emit_on:
  - success
  - partial
  - failed
compliance:
  frameworks:
    gdpr:
      applicable: true
      jurisdiction: EU/EEA
      legal_basis: legitimate_interest
      special_category_data: false
      dpia_required: false
  sensitivity: Confidential
  purpose: 'Campaign, ads and email engagement data: measures rider acquisition and
    retention.'
  erasure:
    strategy: redact
bronze_layer: bronze
silver_layer: silver
gold_layer: gold
products:
- id: acquisition_performance
  name: Acquisition Performance
  description: Paid acquisition spend and return on investment by campaign.
  lifecycle: active
  expected_outputs:
  - id: agg_acquisition_roi
    name: Google Ads Acquisition ROI
    kind: table
retention:
  bronze: P7D
  silver: P90D
  gold: P7Y
concepts:
  Anonymous device user:
    definition: An anonymous, device-level identifier assigned by Google Analytics
      to track app activity before or without a sign-in.
    also_called:
    - User pseudo
    - Pseudonymous user
    - Device-level user
    - GA pseudo user
