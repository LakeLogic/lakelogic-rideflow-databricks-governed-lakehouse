version: 1.0.0

info:
  title: Gold — Fact Fx Rates Daily Daily
  target_layer: gold
  description: 'grain: one row per day'
  table_name: '{gold_layer}_fact_fx_rates_daily_daily'
  system: internal
  domain: reference

model:
  fields:
  - name: activity_date
    type: date
    required: true
    description: Grain key of the 'fx_rates_daily_daily' fact.
  - name: rate
    type: decimal(18,8)
    required: false
    description: The exchange rate value used to convert one unit of the base currency
      into the quote currency.
  - name: date_key
    type: integer
    required: false
    foreign_key:
      contract: gold_dim_date
      column: date_key
    description: The day of activity_date as YYYYMMDD — the key of the date dimension.
  - name: system
    type: string
    required: true
    description: Source system this row came from

dataset: gold_fact_fx_rates_daily_daily

primary_key:
- activity_date

quality:
  dataset_rules:
  - unique:
      columns:
      - activity_date
      name: activity_date_unique
      category: uniqueness
      description: No two rows share the same activity_date.

transformations:
- phase: pre
  sql: |-
    WITH touched AS (
      SELECT DISTINCT
        CAST(rate_date AS DATE) AS _touched_0
      FROM source
    ),
    r AS (
      SELECT
        CAST(rate_date AS DATE) AS activity_date,
        MAX(rate) AS rate
      FROM silver_internal_fx_rates_daily_full
      JOIN touched
        ON CAST(rate_date AS DATE) = touched._touched_0
      GROUP BY CAST(rate_date AS DATE)
    )
    SELECT
      r.activity_date,
      r.rate,
      CAST(EXTRACT(YEAR FROM r.activity_date) AS BIGINT) * 10000 + CAST(EXTRACT(MONTH FROM r.activity_date) AS BIGINT) * 100 + CAST(EXTRACT(DAY FROM r.activity_date) AS BIGINT) AS date_key
    FROM r
- phase: pre
  derive:
    field: system
    sql: '''internal'''

links:
- name: silver_internal_fx_rates_daily_full
  type: table
  path: table:{silver_root}.{silver_layer}_internal_fx_rates_daily

upstream: []

materialization:
  fact:
    type: aggregate

source:
  type: table
  path: table:{silver_root}.{silver_layer}_internal_fx_rates_daily
  load_mode: incremental
  watermark_field: _lakelogic_processed_at

metadata:
  run_log_table: '{domain_catalog}.lakelogic_run_log'
