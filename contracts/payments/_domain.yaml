domain: payments
ownership:
  domain_owner: Finance Engineering
  team: finance_engineering
  contacts:
  - name: Finance Data Lead
    role: oncall
    email: finance-data@rideflow.com
  cost_center: finance_ops
  jira_project: PAYMENTS
slo:
  freshness:
    bronze:
      max_delay_minutes: 120
      check_columns:
      - _lakelogic_processed_at
    silver:
      max_delay_minutes: 300
      check_columns:
      - _lakelogic_processed_at
  row_count:
    bronze:
      min_rows: 1
      max_rows: 200000
      warn_only: false
      anomaly:
        enabled: true
        lookback_runs: 14
        min_ratio: 0.5
        max_ratio: 2.0
        method: median
        min_runs_before_enforcement: 5
    silver:
      min_rows: 1
      max_rows: 200000
      warn_only: false
      anomaly:
        enabled: true
        lookback_runs: 14
        min_ratio: 0.5
        max_ratio: 2.0
        method: median
        min_runs_before_enforcement: 5
  quality:
    min_good_ratio: 0.99
    max_quarantine_ratio: 0.01
    by_severity:
      critical:
        min_good_ratio: 0.9999
      high:
        min_good_ratio: 0.999
      medium:
        min_good_ratio: 0.99
      low:
        min_good_ratio: 0.95
quality_coverage:
  silver:
    field_check_target: 0.7
  gold:
    require:
    - grain_unique
    - referential_integrity
cost:
  currency: GBP
  budget:
    daily_limit: 25.0
    weekly_limit: 125.0
    monthly_limit: 400.0
    per_run_anomaly_multiplier: 3.0
    alert_channels:
    - slack
    - email
observatory:
  enabled: true
  environments:
  - dev
  - prod
  - staging
  - local
  - local_polars
  endpoint: ${LAKELOGIC_OBSERVATORY_ENDPOINT}
  api_key: ${LAKELOGIC_API_KEY}
  emit_on:
  - success
  - partial
  - failed
compliance:
  frameworks:
    gdpr:
      applicable: true
      jurisdiction: EU/EEA
      legal_basis: contract
      special_category_data: false
      dpia_required: false
  sensitivity: Confidential
  purpose: 'Payments, refunds, payouts and driver expenses: revenue and reconciliation.'
  erasure:
    strategy: hash
bronze_layer: bronze
silver_layer: silver
gold_layer: gold
products: []
retention:
  bronze: P7D
  silver: P90D
  gold: P7Y
concepts:
  Payment charge:
    definition: A payment collected from a rider for a trip, showing the amount, currency,
      payment method and collection status.
    identifier: charge_id
    also_called:
    - Charge
    - Rider payment
    - Trip payment
    - Stripe charge
