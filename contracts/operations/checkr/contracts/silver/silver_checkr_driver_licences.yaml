version: 1.0.0

info:
  title: Silver — Checkr Driver Licences
  target_layer: silver
  description: Driver licence records captured from Checkr background checks, holding
    the holder's name, date of birth and licence number alongside the issuing authority
    and jurisdiction, expiry date and the vehicle classes the holder is permitted
    to drive. Each row traces back to the source document it was extracted from, and
    the licence number is the identifier used to match a licence to the correct driver.
    The licence number and date of birth are flagged as personal data.
  table_name: '{silver_layer}_checkr_driver_licences'
  system: checkr
  domain: operations

model:
  fields:
  - name: file_path
    type: string
    required: false
    description: Column 'file_path' projected from source table 'checkr_driver_licences',
      typed as string.
  - name: holder_name
    type: string
    required: false
    description: Column 'holder_name' projected from source table 'checkr_driver_licences',
      typed as string.
  - name: licence_number
    type: string
    required: false
    pii: true
    classification: licence_id
    description: Column 'licence_number' projected from source table 'checkr_driver_licences',
      typed as string. Personal data (licence_id), not masked.
  - name: date_of_birth
    type: date
    required: false
    pii: true
    classification: date_of_birth
    description: Column 'date_of_birth' projected from source table 'checkr_driver_licences',
      typed as date. Personal data (date_of_birth), not masked.
  - name: expiry_date
    type: date
    required: false
    description: Column 'expiry_date' projected from source table 'checkr_driver_licences',
      typed as date.
  - name: vehicle_classes
    type: string
    required: false
    description: Column 'vehicle_classes' projected from source table 'checkr_driver_licences',
      typed as string.

materialization:
  strategy: overwrite

dataset: silver_checkr_driver_licences

source:
  type: table
  path: table:{bronze_root}.{bronze_layer}_checkr_driver_licences
  load_mode: incremental
  watermark_field: _lakelogic_processed_at

metadata:
  run_log_table: '{domain_catalog}.lakelogic_run_log'
