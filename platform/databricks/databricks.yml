bundle:
  name: rideflow-databricks-lakehouse

include:
- resources/*.yml
- resources/*/*.yml

sync:
  paths:
  - .
  - ../../contracts
  exclude:
  - tests

variables:
  catalog:
    description: Passed to the notebooks as the target's catalog. Domain catalog names
      come from each _system.yaml (domain_catalog_prefix), not from this.
    default: rideflow_dev
  landing_storage_root:
    description: Optional external storage for the landing Volumes (<root>/landing_<domain>). Blank
      (default) = managed Volumes inside Databricks; the seed job writes the sample files into them.
    default: ''
  catalog_storage_root:
    description: Storage location for a catalog setup creates (MANAGED LOCATION <root>/<catalog>).
      Blank = the metastore's own storage.
    default: ''
  lakelogic_version:
    description: The LakeLogic version installed (from the deployment target).
    default: 1.85.1
  lakelogic_wheel:
    description: Path to a LakeLogic wheel in a Volume. Blank installs from PyPI.
    default: ''
  lakelogic_extras:
    description: The LakeLogic extras installed (documents = the PDF, image and Word
      readers).
    default: synthetic,pdf,documents
  telemetry_endpoint:
    description: LakeLogic run-log ingest URL. Blank = run logs stay in the lakehouse.
    default: https://reimburse-stable-same.ngrok-free.dev/api/v1/operations/run-logs/ingest
  telemetry_key_scope:
    description: Databricks secret scope holding the LakeLogic API key. The key is
      never stored here.
    default: ''
  telemetry_key_secret:
    description: Secret NAME within that scope. Not a secret itself.
    default: ''
  telemetry_endpoint_secret:
    description: Secret NAME in that scope holding the ingest URL, used when telemetry_endpoint
      is blank. Not a secret itself.
    default: ''

workspace:
  root_path: /Workspace/Shared/lakelogic-rideflow-databricks-governed-lakehouse/dev

targets:
  dev:
    default: true
    variables:
      catalog: rideflow_dev
      # The metastore has no storage root, so a catalog setup creates needs a location. The six
      # domain catalogs live here (created 2026-10-27 with this root passed by hand, never saved,
      # so the next new catalog - rideflow_dev_shared - failed). Kept here so every run uses it.
      catalog_storage_root: abfss://unity-catalog-storage@dbstoragegjbcqqdws2r4o.dfs.core.windows.net/7405615991211788/catalogs
      lakelogic_version: 1.85.1
      lakelogic_wheel: ''
      telemetry_key_scope: ''
      telemetry_key_secret: ''
    workspace:
      root_path: /Workspace/Shared/lakelogic-rideflow-databricks-governed-lakehouse/dev
